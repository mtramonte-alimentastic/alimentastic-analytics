<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hours report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
/* Layout: Arbeitswerkzeug. Kopf mit Logo und Dateistatus, darunter Zeitraum und Reiter, Inhalt als Kennzahlen, Balken und Tabellen. Rot nur als Akzent. */
:root{
  --bg:#ffffff; --surface:#f7f5f5; --ink:#141212; --ink-2:#5e5858; --ink-3:#c4bdbd; --line:#e7e2e2;
  --red:#D6001C; --red-soft:#fdeef0; --red-3:#f0a3ad;
  --ok:#1b7548; --ok-soft:#e6f3ec; --warn:#94580a; --warn-soft:#fbf1df; --crit:#b3001a; --crit-soft:#fde9eb;
  --f-body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --f-label:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f0e0e; --surface:#1a1818; --ink:#f3f0f0; --ink-2:#aaa3a3; --ink-3:#5a5454; --line:#2d2a2a;
    --red:#f0283f; --red-soft:#3a1419; --red-3:#7d2230;
    --ok:#5cc690; --ok-soft:#14291e; --warn:#e3a54a; --warn-soft:#2e2312; --crit:#ff6b7c; --crit-soft:#3a1419;
    color-scheme:dark;
  }
  :root:not([data-theme="light"]) .logo-light{display:none}
  :root:not([data-theme="light"]) .logo-dark{display:block}
}
:root[data-theme="dark"]{
  --bg:#0f0e0e; --surface:#1a1818; --ink:#f3f0f0; --ink-2:#aaa3a3; --ink-3:#5a5454; --line:#2d2a2a;
  --red:#f0283f; --red-soft:#3a1419; --red-3:#7d2230;
  --ok:#5cc690; --ok-soft:#14291e; --warn:#e3a54a; --warn-soft:#2e2312; --crit:#ff6b7c; --crit-soft:#3a1419;
  color-scheme:dark;
}
:root[data-theme="dark"] .logo-light{display:none}
:root[data-theme="dark"] .logo-dark{display:block}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:20px 60px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:1.6rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.2rem;font-weight:700}
h3{font-size:1rem;font-weight:600}
p{margin:0}
.label{font-family:var(--f-label);font-weight:600;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.muted{color:var(--ink-2)}
.num{font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* Kopf */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:16px 24px;justify-content:space-between;padding-bottom:18px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:18px;min-width:0}
.logo{height:34px;width:auto}
.logo-dark{display:none}
.brand .sep{width:1px;height:34px;background:var(--line)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.88}
.btn.small{padding:5px 10px;font-size:.88rem}
.btn svg{width:16px;height:16px;flex:none}

/* Dateien */
.files{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
#files{margin-top:20px}
.file{border:1px dashed var(--ink-3);border-radius:8px;padding:10px 12px;min-width:0;display:flex;flex-direction:column;gap:2px}
.file.on{border-style:solid;border-color:var(--line);background:var(--surface)}
.file .fname{font-size:.82rem;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .dept{font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--ink-3)}
.file.on .dot{background:var(--ok)}
.drop-hint{margin-top:8px;font-size:.85rem;color:var(--ink-2)}
body.dragging .files{outline:2px dashed var(--red);outline-offset:6px;border-radius:10px}

.banner{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;background:var(--red-soft);border-radius:8px;padding:10px 14px}
.banner b{color:var(--red)}

/* Zeitraum + Reiter */
.bar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-top:22px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.period{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select,input[type=text],input[type=number]{border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:7px 10px;min-width:0}
.navrow{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px;margin-top:20px;border-bottom:1px solid var(--line)}
.navrow .period{padding-bottom:8px}
.navrow .seg button{padding:6px 12px}
.tabs{display:flex;gap:2px;overflow-x:auto;min-width:0}
.more{position:relative}
.more summary{list-style:none}
.more summary::-webkit-details-marker{display:none}
.more .menu{position:absolute;right:0;top:calc(100% + 6px);z-index:15;min-width:240px;background:var(--bg);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:6px;display:flex;flex-direction:column}
.more .menu .mi{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:6px;cursor:pointer;font:inherit;color:inherit;text-decoration:none}
.more .menu .mi:hover{background:var(--surface)}
.more .menu .mi small{display:block;color:var(--ink-2);font-size:.8rem}
.more .menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.strip{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:.88rem;padding:7px 12px;border-radius:6px;background:var(--red-soft)}
.strip b{color:var(--red)}
.strip .lnk{border:0;background:none;padding:0;font:inherit;color:var(--red);text-decoration:underline;cursor:pointer}
.tab{border:0;background:transparent;padding:10px 14px;cursor:pointer;font-weight:500;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red)}
.count{font-size:.75rem;font-weight:600;border-radius:999px;padding:1px 7px;background:var(--surface);color:var(--ink-2)}
.count.crit{background:var(--crit-soft);color:var(--crit)}

main{margin-top:24px;display:flex;flex-direction:column;gap:28px}
.section{display:flex;flex-direction:column;gap:12px;min-width:0}
.section-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}

/* Kennzahlen */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-size:1.55rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .s{font-size:.82rem;color:var(--ink-2)}

/* Tabellen */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-label);font-weight:600;font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);background:var(--surface);white-space:nowrap}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.total td{font-weight:700;border-top:2px solid var(--ink)}
td.wrap-text{min-width:220px}
.empty{padding:28px;text-align:center;color:var(--ink-2)}

/* Status */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.info{background:var(--surface);color:var(--ink-2)}
.pill svg{width:12px;height:12px}
.grid-status td{text-align:center;padding:6px 4px;min-width:56px}
.grid-status td:first-child{text-align:left;padding-left:12px;white-space:nowrap}
.cell{display:block;border-radius:4px;padding:5px 2px;font-size:.8rem;font-weight:600;font-variant-numeric:tabular-nums}
.cell.ok{background:var(--ok-soft);color:var(--ok)}
.cell.late{background:var(--crit-soft);color:var(--crit)}
.cell.due{background:var(--warn-soft);color:var(--warn)}
.cell.open{color:var(--ink-3)}
.summary{display:flex;flex-wrap:wrap;gap:8px}

/* Balken */
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.85rem;color:var(--ink-2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.hbars{display:flex;flex-direction:column;gap:8px}
.hbar{display:grid;grid-template-columns:minmax(110px,200px) 1fr 118px;gap:12px;align-items:center}
.hbar .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{display:flex;gap:2px;height:18px;min-width:0}
.seg-d,.seg-u,.seg-r,.seg-ru{border-radius:0 4px 4px 0}
.seg-d{background:var(--ink)}
.seg-u{background:var(--ink-3)}
.seg-r{background:var(--red)}
.seg-ru{background:var(--red-3)}
.track span:not(:last-child){border-radius:0}
.hbar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.hbar .v small{font-weight:500;color:var(--ink-2)}
.hbar.group{padding:6px 0}
.hbar.group .n{font-weight:700;font-size:1.02rem}
.hbar.group .track{height:26px}
.hbar.group.reploid .n{color:var(--red)}
.hbar.sub .n{padding-left:26px;color:var(--ink-2)}
.hbar.sub .track{height:12px}
.hbar.sub .v{font-weight:500}
.tg{border:0;background:none;cursor:pointer;padding:0;display:inline-flex;gap:8px;align-items:center;font:inherit;font-weight:inherit;color:inherit;max-width:100%}
.tg svg{width:12px;height:12px;flex:none;transition:transform .15s}
.tg[aria-expanded="true"] svg{transform:rotate(90deg)}
.tg .c{font-weight:500;color:var(--ink-2)}
tr.grp td{font-weight:700;background:var(--surface)}
tr.grp.reploid td{background:var(--red-soft)}
tr.grp.reploid td:first-child{color:var(--red)}
tr.sub td:first-child{padding-left:34px;color:var(--ink-2)}
.kpi.hero{background:var(--red-soft)}
.kpi.hero .label{color:var(--red)}
.split{display:flex;gap:2px;height:34px;border-radius:6px;overflow:hidden}
.split span{display:flex;align-items:center;padding:0 12px;font-size:.88rem;font-weight:600;white-space:nowrap;overflow:hidden;min-width:0}
.split .r{background:var(--red);color:#fff}
.split .d{background:var(--ink);color:var(--bg)}
.split .a{background:var(--ink-3);color:var(--ink)}
.cols{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:22px;border-bottom:1px solid var(--line);overflow-x:auto}
.col{flex:1 0 34px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.col .b{width:70%;max-width:44px;background:var(--ink-3);border-radius:4px 4px 0 0;min-height:2px}
.col.sel .b{background:var(--red)}
.col .t{position:absolute;font-size:.75rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.col-labels{display:flex;gap:6px;overflow-x:hidden}
.col-labels span{flex:1 0 34px;text-align:center;font-size:.75rem;color:var(--ink-2)}

.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px}
.story{background:var(--surface);border-radius:8px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;max-width:none}
.story p{max-width:75ch}
.story-actions{display:flex;flex-wrap:wrap;gap:8px}

.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
.field{display:flex;flex-direction:column;gap:6px}
.field small{color:var(--ink-2)}
.radio{display:flex;gap:8px;align-items:flex-start;padding:6px 0;cursor:pointer}
.radio input{margin-top:4px}
.inline{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input.short{width:90px}
.note{font-size:.85rem;color:var(--ink-2);max-width:75ch}

.panel{border:1px solid var(--line);border-radius:8px;padding:16px 18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.pfile{display:flex;flex-direction:column;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.pfile:last-of-type{border-bottom:0;padding-bottom:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface);border-radius:999px;padding:3px 10px;font-size:.82rem;font-variant-numeric:tabular-nums}
details summary{cursor:pointer;color:var(--ink-2);font-size:.9rem}
details[open] summary{margin-bottom:8px}
.cell.lateok{background:var(--warn-soft);color:var(--warn)}
button.cell{border:0;width:100%;cursor:pointer;font-family:inherit}
button.cell:hover{outline:1px solid currentColor}
.cell.exc{background:var(--surface);color:var(--ink-2);outline:1px dashed var(--ink-3)}
.cell.inactive{color:var(--ink-3)}
.grid-status tr.grp td{text-align:left;font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;font-family:var(--f-label);color:var(--ink-2);padding:6px 12px}
#excPanel{border-color:var(--ink-2)}
.namecell{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.remind{display:inline-flex;gap:8px;font-size:.78rem}
.remind a{color:var(--red);text-decoration:none;font-weight:600}
.remind a:hover{text-decoration:underline}
a.btn{text-decoration:none;color:inherit}
.cellmenu{display:flex;gap:4px;justify-content:center}
.ai{margin-top:6px;font-size:.82rem;padding:5px 8px;border-radius:6px;color:var(--ink)}
.ai.ok{background:var(--ok-soft)}
.ai.ok b{color:var(--ok)}
.ai.ask{background:var(--warn-soft)}
.ai.ask b{color:var(--warn)}
.cellmenu .btn{padding:3px 7px;font-size:.75rem}
.file .who{font-size:.82rem;color:var(--ink-2)}
.file .st{margin-top:4px}
.hits{display:flex;flex-wrap:wrap;gap:6px}
.resp{display:grid;grid-template-columns:minmax(110px,150px) minmax(0,1fr);gap:8px 12px;align-items:start}
.resp > span{padding-top:7px}
.loading{padding:48px 16px;text-align:center;color:var(--ink-2)}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.82rem;padding:6px 10px;border-radius:6px;z-index:20;max-width:260px;white-space:pre-line}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:30;font-size:.9rem;max-width:calc(100% - 32px)}
textarea.copybuf{position:fixed;left:-9999px;top:0}

@media (max-width:860px){
  .files{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:480px){
  .wrap{padding-inline:16px}
  .files{grid-template-columns:minmax(0,1fr)}
  .hbar{grid-template-columns:minmax(80px,120px) 1fr 92px;gap:8px}
  .hbar.sub .n{padding-left:14px}
  .logo{height:28px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
"use strict";
const DAY = 864e5;
const NO_TEAM = 'No team';
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

/* ---------- helpers ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bkey = s => String(s || '').toLowerCase().replace(/&/g, 'und').replace(/[^a-z0-9äöüß]/g, '');
const fmtNum = (n, d = 1) => (n == null || isNaN(n)) ? '–' : n.toLocaleString('en-GB', {minimumFractionDigits: d, maximumFractionDigits: d});
const fmtH = n => fmtNum(n, 1) + ' h';
const fmtEur = n => '€ ' + Math.round(n).toLocaleString('en-GB');
const fmtPct = n => fmtNum(n * 100, 0) + ' %';
const pad = n => String(n).padStart(2, '0');
const fmtDate = d => d ? `${pad(d.getUTCDate())}.${pad(d.getUTCMonth() + 1)}.${d.getUTCFullYear()}` : '';
const fmtDateShort = d => `${pad(d.getUTCDate())}.${pad(d.getUTCMonth() + 1)}.`;
const round2 = n => Math.round(n * 100) / 100;
const sum = arr => arr.reduce((a, b) => a + b, 0);
const str = v => v == null ? '' : String(v).trim();
const cap1 = s => s.replace(/^./, c => c.toUpperCase());
const fmtTime = iso => iso ? new Date(iso).toLocaleString('en-GB', {weekday: 'short', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'}) : '';

/* Weeks are identified by their ISO id ("2026-W41"), which sorts correctly as text, also across New Year. */
function mondayOf(wk) {
  const [y, w] = wk.split('-W').map(Number);
  const jan4 = Date.UTC(y, 0, 4);
  const dow = (new Date(jan4).getUTCDay() + 6) % 7;
  return new Date(jan4 - dow * DAY + (w - 1) * 7 * DAY);
}
function weekOf(date) {
  const d = new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate()));
  const dow = (d.getUTCDay() + 6) % 7;
  d.setUTCDate(d.getUTCDate() - dow + 3);
  const y = d.getUTCFullYear();
  const first = mondayOf(y + '-W01');
  return y + '-W' + pad(1 + Math.round((d - first - 3 * DAY) / (7 * DAY)));
}
const kwOf = wk => +String(wk).split('-W')[1];
const addWeeks = (wk, n) => weekOf(new Date(mondayOf(wk).getTime() + n * 7 * DAY));
function weekRange(a, b) { const out = []; let w = a; for (let i = 0; i < 260 && w <= b; i++) { out.push(w); w = addWeeks(w, 1); } return out; }
function weekLabel(wk) { const s = mondayOf(wk), e = new Date(s.getTime() + 6 * DAY); return `Week ${kwOf(wk)} · ${fmtDateShort(s)}–${fmtDate(e)}`; }
function monthLabel(m) { const [y, mo] = m.split('-').map(Number); return `${MONTHS[mo - 1]} ${y}`; }
function workdays(m) {
  const [y, mo] = m.split('-').map(Number); let n = 0;

}

}
const nTokens = s => String(s || '').toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ß/g, 'ss').replace(/[^a-z\s-]/g, ' ').split(/[\s-]+/).filter(Boolean);

}

/* ---------- state ---------- */

async function loadData() {

  if (r.status === 401) throw new Error('Please sign in again in Brand Time.');
  if (r.status === 403) throw new Error('Reports are only available to admins.');
  if (!r.ok) throw new Error('The report data could not be loaded.');
  const j = await r.json();
  S.cfg = j.config || {brands: [], tasks: []}; S.cfg.brands = S.cfg.brands || [];
  S.roster = j.roster || []; S.weeksRaw = j.weeks || []; S.me = j.me || {email: ''};

  for (const p of (j.profiles || [])) if (p.email) S.profileTeam[String(p.email).toLowerCase()] = p.team || '';
  const st = j.state || {};

/* ---------- brands, groups ---------- */
/* Brands that belong to Reploid (group "Reploid" in all reports; changeable in Settings) */
const REPLOID_BRANDS = new Set(['beakbandits', 'huhnglaublich', 'kreislaufei', 'schnauzeundco']);
/* Items without a brand of their own: treated as "General" (changeable in Settings) */
const OVERHEAD = new Set(['urlaub', 'krankenstand', 'zeitausgleich', 'feiertag', 'karenz', 'sial', 'allgemein', 'allemarken', 'vertrieballgemein', 'alimentastic', 'adminundreporting', 'teamundplanning', 'recruitingundonboarding', 'learningunddevelopment', 'petfood', 'organisation']);
const GROUP_LABEL = {Reploid: 'Reploid', Diverse: 'Diverse brands', Allgemein: 'General (no brand)', aus: 'Not in investor report'};

function knownBrands() {
  const reg = new Map();
  for (const b of S.cfg.brands) { const k = bkey(b.name); if (k && !reg.has(k)) reg.set(k, b.name); }
  for (const [k, v] of Object.entries(S.settings.brands)) if (v && v.name && !reg.has(k)) reg.set(k, v.name);
  return reg;
}
function brandKind(name) {
  const c = S.settings.brands[bkey(name)] || {};
  if (c.kind === 'allgemein' || c.kind === 'marke') return c.kind;
  const cfg = CFG_BY_KEY[bkey(name)];
  return (OVERHEAD.has(bkey(name)) || (cfg && cfg.group === 'internal')) ? 'allgemein' : 'marke';
}
const brandCfg = b => S.settings.brands[bkey(b)] || {};
function groupOf(b) {
  if (bkey(b) === 'allgemein' || brandKind(b) === 'allgemein') return 'Allgemein';
  const c = brandCfg(b);
  if (c.group === 'Reploid' || c.group === 'Diverse' || c.group === 'aus') return c.group;
  return bkey(b).includes('reploid') || REPLOID_BRANDS.has(bkey(b)) ? 'Reploid' : 'Diverse';
}
const inInvestor = b => groupOf(b) !== 'aus';
function groupsOf(list, withHidden) {
  const gs = withHidden ? ['Reploid', 'Diverse', 'Allgemein', 'aus'] : ['Reploid', 'Diverse', 'Allgemein'];
  return gs.map(g => {
    const items = list.filter(x => groupOf(x.brand) === g);
    const byDept = {};
    for (const x of items) for (const [d, h] of Object.entries(x.byDept)) byDept[d] = (byDept[d] || 0) + h;
    return {group: g, label: GROUP_LABEL[g], items, byDept, direct: sum(items.map(x => x.direct)), alloc: sum(items.map(x => x.alloc)), total: sum(items.map(x => x.total))};
  }).filter(G => (G.group !== 'aus' && G.group !== 'Allgemein') || G.items.length);
}
const expandable = G => G.items.length > 1 || (G.items.length === 1 && bkey(G.items[0].brand) !== bkey(G.group));
const CHEV = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function groupName(G) {
  if (!expandable(G)) return esc(G.label);
  return `<button class="tg" data-action="toggle-group" data-g="${G.group}" aria-expanded="${!!S.open[G.group]}">${CHEV}<span>${esc(G.label)}</span>${G.group !== 'Reploid' || G.items.length > 1 ? `<span class="c">${G.items.length}</span>` : ''}</button>`;
}

/* ---------- rows ---------- */
/* A person's department is their team: an admin's override (Settings -> People) wins over what they chose themselves. */
const deptOf = email => { const k = String(email).toLowerCase(); return str((S.people[k] || {}).team) || S.profileTeam[k] || NO_TEAM; };
const deptRank = d => { const i = S.teams.indexOf(d); return i < 0 ? 99 : i; };
const personName = email => str((S.people[String(email).toLowerCase()] || {}).name) || prettyEmail(email);
function buildRaw() {
  const rows = [], days = [];
  const byId = new Map(S.cfg.brands.map(b => [b.id, b]));
  for (const rec of S.weeksRaw) {
    const doc = rec.doc; if (!doc) continue;
    if (!(doc.submitted || S.settings.includeDrafts)) continue;
    const week = rec.week, email = String(rec.email || '(unknown)').toLowerCase(), person = personName(email), dept = deptOf(email);
    for (const iso of Object.keys(doc.days || {}).sort()) {
      const d = doc.days[iso] || {}; const worked = typeof d.worked === 'number' ? d.worked : null; const rs = d.rows || [];
      days.push({week, email, person, dept, iso, worked, n: rs.length, hours: sum(rs.map(x => +x.h || 0))});
      for (const x of rs) {
        const b = byId.get(x.b);
        rows.push({week, kw: kwOf(week), dept, email, emp: email, person, iso, date: new Date(iso + 'T00:00:00Z'), month: iso.slice(0, 7),
          brandRaw: b ? b.name : str(x.b), brandId: x.b, hours: +x.h || 0, topic: str(x.t), note: str(x.n), bmd: worked});
      }
    }
  }
  return {rows, days};
}
function normRows(rows, reg) {
  return rows.map(r => {
    const raw = str(r.brandRaw); const k = bkey(raw); let brand = raw, known = false, aliased = false;
    if (k && reg.has(k)) { brand = reg.get(k); known = true; }
    const alias = (S.settings.brands[bkey(brand)] || {}).alias;
    if (alias && bkey(alias) !== bkey(brand)) { brand = alias; aliased = true; known = true; }
    const kind = brand ? brandKind(brand) : '';
    return Object.assign({}, r, {brand, known, aliased, isAllg: kind === 'allgemein'});
  });
}
/* Finds brand names in a text (note or task) */
function brandFinder(rows, reg) {
  const names = new Map();
  for (const n of reg.values()) if (brandKind(n) !== 'allgemein') names.set(bkey(n), n);
  for (const r of rows) if (r.brand && !r.isAllg && brandKind(r.brand) !== 'allgemein') names.set(bkey(r.brand), r.brand);
  const list = Array.from(names.entries()).filter(([k]) => k.length >= 3);
  return text => {
    const tk = bkey(text); const toks = new Set(nTokens(text).map(bkey));
    const hits = list.filter(([k]) => k.length >= 5 ? tk.includes(k) : toks.has(k)).map(([, n]) => n);
    return hits.filter(h => !hits.some(o => o !== h && bkey(o).includes(bkey(h))));
  };
}
/* General rows whose task or note names a brand are assigned to that brand. Several brands share the hours equally. */
function autoAssign(rows, reg) {
  const find = brandFinder(rows, reg);
  return rows.flatMap(r => {
    if (!r.isAllg || !(r.hours > 0)) return [r];
    let parts;
    const topic = String(r.topic || '');
    const head = topic.includes(':') ? find(topic.split(':')[0]) : [];
    if (head.length) {
      parts = head.map(b => ({b, sh: 1 / head.length}));
    } else if (find(topic).length) {
      const segs = []; let depth = 0, cur = '';
      for (const ch of topic) {
        if (ch === '(' || ch === '[') depth++;
        if (ch === ')' || ch === ']') depth = Math.max(0, depth - 1);
        if (depth === 0 && /[,;\n+]/.test(ch)) { segs.push(cur.trim()); cur = ''; } else cur += ch;
      }
      segs.push(cur.trim()); for (let i = segs.length - 1; i >= 0; i--) if (!segs[i]) segs.splice(i, 1);
      const n = segs.length || 1; const acc = new Map(); let rest = 0;
      for (const s of segs) { const h = find(s); if (!h.length) { rest += 1 / n; continue; } for (const b of h) acc.set(b, (acc.get(b) || 0) + 1 / n / h.length); }
      if (!acc.size) { const h = find(r.topic); h.forEach(b => acc.set(b, 1 / h.length)); rest = 0; }
      parts = Array.from(acc.entries()).map(([b, sh]) => ({b, sh}));
      if (rest > 0.0001) parts.push({b: null, sh: rest});
    } else {
      const h = find(r.note || '');
      if (!h.length) return [r];
      parts = h.map(b => ({b, sh: 1 / h.length}));
    }
    const branded = parts.filter(p => p.b);
    const desc = branded.map(p => `${fmtNum(r.hours * p.sh)} h ${p.b}`).join(', ');
    return parts.map(p => p.b
      ? Object.assign({}, r, {brand: p.b, isAllg: false, known: true, reassigned: true, assignDesc: desc, assignSum: sum(branded.map(q => r.hours * q.sh)), fromBrand: r.brand, splitFirst: p === branded[0], hours: r.hours * p.sh, origHours: r.hours})
      : Object.assign({}, r, {hours: r.hours * p.sh, assignedRest: true}));
  });
}
function rebuild() {
  CFG_BY_KEY = {}; for (const b of S.cfg.brands) CFG_BY_KEY[bkey(b.name)] = b;
  const reg = knownBrands();
  const raw = buildRaw(); DAYS = raw.days;
  ROWS = normRows(raw.rows, reg);
  if (S.settings.autoAssign !== false) ROWS = autoAssign(ROWS, reg);
  // weeks shown in selectors and status grids
  const all = S.weeksRaw.map(w => w.week).concat(ROWS.map(r => r.week)).sort();
  const nowWk = weekOf(new Date());
  // Every week that has data stays selectable. "Track from week" (Settings) only decides from when missing
  // submissions are flagged in the status grid; it must never hide data that exists.
  const dataFirst = all[0] || nowWk;
  const startSetting = S.settings.startWeek && S.settings.startWeek <= nowWk ? S.settings.startWeek : null;
  const first = startSetting && startSetting < dataFirst ? startSetting : dataFirst;
  const last = [nowWk, all[all.length - 1] || nowWk].sort().pop();
  WEEKS = weekRange(first <= last ? first : last, last);
}
const counts = r => r.hours > 0 && r.brand;
function inPeriod(r, mode = S.mode, p = S.period) {
  if (mode === 'week') return r.week === p;
  if (mode === 'month') return r.month === p;
  return true;
}
const periodRows = (mode, p) => ROWS.filter(r => counts(r) && inPeriod(r, mode, p));
/* Teams in their configured order, then any other department that shows up in the data (e.g. "No team"). */
function deptsAll() {
  const out = S.teams.slice();
  for (const r of ROWS) if (r.dept && !out.includes(r.dept)) out.push(r.dept);
  for (const e of S.roster) { const d = deptOf(e); if (!out.includes(d)) out.push(d); }
  return out;
}
function weeksIn(mode, p, rows) {
  if (mode === 'week') return 1;
  if (mode === 'month') return workdays(p) / 5;
  return Math.max(1, new Set(rows.map(r => r.week)).size);
}
const hasRates = () => Object.values(S.settings.rates).some(v => v > 0);
const costOf = byDept => sum(Object.entries(byDept).map(([d, h]) => h * (S.settings.rates[d] || 0)));
const methodLabel = () => ({none: 'General as its own item', dept: 'General allocated pro rata by department', all: 'General allocated pro rata across all departments', fixed: 'General allocated by fixed key'}[S.settings.method] || '');

/* ---------- allocation of "General" hours ---------- */
function allocate(rows) {
  const direct = {}, alloc = {}, gen = {};
  const add = (o, b, d, h) => { (o[b] = o[b] || {})[d] = (o[b][d] || 0) + h; };
  const keepAllg = S.settings.method === 'none';
  for (const r of rows) {
    if (r.isAllg) { gen[r.dept] = (gen[r.dept] || 0) + r.hours; if (keepAllg) add(direct, r.brand || 'General', r.dept, r.hours); }
    else add(direct, r.brand, r.dept, r.hours);
  }
  const brands = Object.keys(direct);
  const totDir = b => sum(Object.values(direct[b] || {}));
  const allDir = sum(brands.map(totDir));
  let unallocated = 0;
  const method = S.settings.method;
  let keyed = [];
  if (method === 'fixed') for (const v of Object.values(S.settings.brands)) if (v && v.key > 0) keyed.push([v.name, v.key]);
  const keySum = sum(keyed.map(x => x[1]));
  if (method !== 'none') for (const [d, A] of Object.entries(gen)) {
    if (method === 'fixed' && keySum > 0) { for (const [b, k] of keyed) add(alloc, b, d, A * k / keySum); continue; }
    const Dd = sum(brands.map(b => (direct[b] || {})[d] || 0));
    if (method === 'dept' && Dd > 0) { for (const b of brands) { const h = (direct[b] || {})[d] || 0; if (h) add(alloc, b, d, A * h / Dd); } }
    else if (allDir > 0) { for (const b of brands) add(alloc, b, d, A * totDir(b) / allDir); }
    else unallocated += A;
  }
  const names = Array.from(new Set([...Object.keys(direct), ...Object.keys(alloc)]));
  const list = names.map(b => {
    const byDept = {}; let dsum = 0, asum = 0;
    for (const d of deptsAll()) {
      const x = (direct[b] || {})[d] || 0, y = (alloc[b] || {})[d] || 0;
      if (x || y) byDept[d] = x + y; dsum += x; asum += y;
    }
    return {brand: b, byDept, direct: dsum, alloc: asum, total: dsum + asum};
  }).sort((a, b) => b.total - a.total);
  const genTotal = sum(Object.values(gen));
  return {list, gen, genTotal, unallocated, total: sum(rows.map(r => r.hours))};
}

/* ---------- period ---------- */
function defaultPeriod(mode = S.mode) {
  const rows = ROWS.filter(counts);
  if (mode === 'week') { const ks = rows.map(r => r.week).sort(); return ks.length ? ks[ks.length - 1] : addWeeks(weekOf(new Date()), -1); }
  if (mode === 'month') { const ms = rows.map(r => r.month).sort(); return ms.length ? ms[ms.length - 1] : new Date().toISOString().slice(0, 7); }
  return 'all';
}
function monthOptions() {
  const set = new Set(ROWS.map(r => r.month)); set.add(new Date().toISOString().slice(0, 7));
  return Array.from(set).sort();
}
function periodName(mode = S.mode, p = S.period) {
  if (mode === 'week') { const s = mondayOf(p); return `in week ${kwOf(p)} (${fmtDateShort(s)}–${fmtDate(new Date(s.getTime() + 6 * DAY))})`; }
  if (mode === 'month') return `in ${monthLabel(p)}`;
  const ks = Array.from(new Set(ROWS.filter(counts).map(r => r.week))).sort();
  return ks.length ? `from week ${kwOf(ks[0])} to week ${kwOf(ks[ks.length - 1])}` : 'across the whole period';
}
const periodSlug = () => S.mode === 'week' ? 'W' + kwOf(S.period) : S.mode === 'month' ? S.period : 'All';
const periodCore = () => periodName().replace(/^(in|from) /, '');

/* ---------- people and submission status ---------- */
const REASONS = ['Vacation', 'Sick leave', 'Time off in lieu', 'Training / business trip', 'Parental leave', 'Other'];
let DOCMAP = new Map();
const docHours = doc => sum(Object.values((doc && doc.days) || {}).flatMap(d => (d.rows || []).map(r => +r.h || 0)));
const startWk = () => (S.settings.startWeek && WEEKS.includes(S.settings.startWeek)) ? S.settings.startWeek : WEEKS[0];
function peopleList() {
  return S.roster.map(email => { const p = S.people[email] || {}; return {id: email, email, name: personName(email), dept: deptOf(email), required: p.required !== false, from: p.from || '', to: p.to || ''}; })
    .sort((a, b) => deptRank(a.dept) - deptRank(b.dept) || a.dept.localeCompare(b.dept) || a.name.localeCompare(b.name));
}
function empStatus(e, wk) {
  const ws = mondayOf(wk), we = new Date(ws.getTime() + 6 * DAY); const iso = d => d.toISOString().slice(0, 10);
  const doc = DOCMAP.get(e.email.toLowerCase() + '|' + wk);
  const submitted = !!(doc && doc.submitted);
  if (wk < startWk() && !submitted) return {s: 'inactive'};
  if ((e.from && e.from > iso(we)) || (e.to && e.to < iso(ws))) return {s: 'inactive'};
  if (submitted) { const at = doc.submittedAt; return {s: 'ok', h: docHours(doc), at, late: !!(at && new Date(at) > deadline(wk))}; }
  const x = S.excuses[e.id + '|' + wk]; if (x) return {s: 'exc', x};
  const h = doc ? docHours(doc) : 0;
  return {s: dueStatus(wk), draft: h > 0, h};
}
function empMissing(list, weeks) {

  for (const e of list.filter(x => x.required)) { const kws = weeks.filter(w => empStatus(e, w).s === 'late'); if (kws.length) out.push({e, kws}); }
  return out;
}
function shownWeeks(list) {
  const out = [];
  for (const w of WEEKS.filter(x => x >= startWk())) { out.push(w); if (list.every(e => ['open', 'inactive'].includes(empStatus(e, w).s))) break; }
  return out;
}
function lastDueWeek() {
  const today = new Date(); today.setHours(23, 59, 59, 0);
  for (let i = WEEKS.length - 1; i >= 0; i--) if (deadline(WEEKS[i]) <= today) return WEEKS[i];
  return null;
}
const REPORT_URL = () => location.origin;
const firstName = e => { const t = String(e.name || '').split(/\s+/)[0]; return t.length > 2 ? t : ''; };
const outlookLink = (to, subject, body) => `https://outlook.office.com/mail/deeplink/compose?to=${encodeURIComponent(to)}&subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

/* ---------- review: findings in the data ---------- */
function findIssues(rows = ROWS) {
  const iss = [];
  const add = (sev, r, msg, det) => { const o = {sev, dept: r.dept, week: r.week, kw: r.kw, iso: r.iso, emp: r.person || r.emp, email: r.email, msg, det: det || ''}; iss.push(o); return o; };
  const reg = knownBrands();
  const mentionKeys = Array.from(reg.entries()).filter(([k, n]) => k.length >= 5 && brandKind(n) !== 'allgemein');
  const findBrand = brandFinder(rows, reg);
  const unknown = new Map();
  for (const r of rows) {
    const running = dueStatus(r.week) === 'open'; // current week: unfinished rows are normal
    if ((r.hours == null || r.hours <= 0) && !running) add('warn', r, 'Hours missing', r.brand ? `${r.brand}: ${r.topic || 'no task'}` : '');
    if (!r.brand) { if (r.hours > 0) add('crit', r, 'Brand missing', `${fmtH(r.hours)} are not counted.`); }
    else if (!r.known && !r.isAllg) { const k = bkey(r.brand); const u = unknown.get(k) || {r, n: 0, h: 0}; u.n++; u.h += r.hours || 0; unknown.set(k, u); }
    if (!r.topic && !running) add('info', r, 'Task missing');
    if (r.reassigned) {
      if (r.splitFirst) {
        const bs = Array.from(new Set(r.assignDesc.split(', ').map(x => x.replace(/^[\d.,]+ h /, ''))));
        add('warn', r, `Belongs to ${bs.join(', ')}`, `"${str(r.topic || r.note).slice(0, 90)}" (${fmtH(r.origHours)}) is booked as ${r.fromBrand}. Provisionally assigned automatically: ${r.assignDesc}${r.origHours - r.assignSum > 0.05 ? `, ${fmtH(r.origHours - r.assignSum)} stay General` : ''}. Please ask for ${bs.length > 1 ? 'the hours to be split across the brands' : `the hours to be booked on "${bs[0]}"`} in Brand Time.`);
      }
    } else if (r.isAllg && r.hours > 0 && !r.assignedRest) {
      const hits = findBrand(r.topic || '').concat(r.topic ? [] : findBrand(r.note || ''));
      if (hits.length) add('warn', r, `Belongs to ${hits.join(', ')}`, `"${str(r.topic || r.note).slice(0, 90)}" (${fmtH(r.hours)}) is booked as ${r.brand || 'General'} but names ${hits.join(', ')}. Please ask for ${hits.length > 1 ? 'the hours to be split across the brands' : `the hours to be booked on "${hits[0]}"`} in Brand Time.`);
    } else if ((r.topic || r.note) && r.brand && !r.isAllg) {
      const tk = bkey(r.topic + ' ' + r.note); const own = bkey(r.brand);
      const hit = mentionKeys.find(([k]) => k !== own && tk.includes(k) && !own.includes(k));
      if (hit) add('warn', r, 'Note does not match brand', `The note names "${hit[1]}" but the hours are booked on "${r.brand}": ${(r.note || r.topic).slice(0, 80)}`);
    }
  }
  for (const u of unknown.values()) {
    add('warn', u.r, 'Brand not in the brand list', `"${u.r.brand}" (${u.n} ${u.n > 1 ? 'entries' : 'entry'}, ${fmtH(u.h)}) is counted as its own brand. Add it in Brand Time under Brands, or merge it with an existing brand in Settings.`);
  }
  // Compare the day's assigned hours with the hours worked that day (BMD)
  const groups = new Map();
  for (const r of rows) { if (!r.iso) continue; const k = r.email + '|' + r.iso; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(r); }
  const noBmd = new Map();
  for (const g of groups.values()) {
    const h = sum(g.map(r => r.hours || 0));
    const vals = Array.from(new Set(g.map(r => r.bmd).filter(v => v != null)));
    if (!vals.length && dueStatus(g[0].week) === 'open') continue;
    if (!vals.length) { const k = g[0].email + '|' + g[0].week; const x = noBmd.get(k) || {r: g[0], days: []}; x.days.push(fmtDateShort(g[0].date)); noBmd.set(k, x); continue; }
    const diff = h - vals[0];
    if (Math.abs(diff) > 0.009) {
      const why = Array.from(new Set(g.map(r => str(r.note)).filter(Boolean))).join('; ');
      add(why ? 'warn' : 'crit', g[0], why ? 'BMD difference with note' : 'BMD difference without note',
        `${fmtH(h)} recorded, BMD ${fmtH(vals[0])} (${diff > 0 ? '+' : ''}${fmtNum(diff, 2)} h). ${why ? `Note: "${why}". Please check this is right.` : 'No note entered.'}`);
    }
  }
  for (const x of noBmd.values()) add('warn', x.r, 'BMD hours missing', `No BMD value on ${x.days.length} day${x.days.length > 1 ? 's' : ''}: ${x.days.join(', ')}`);
  // Days with hours worked but nothing assigned to a brand
  for (const d of DAYS) {
    if (d.n === 0 && d.worked > 0 && dueStatus(d.week) !== 'open') {
      add('crit', {dept: d.dept, week: d.week, kw: kwOf(d.week), iso: d.iso, person: d.person, email: d.email}, 'Hours worked but nothing assigned', `${fmtH(d.worked)} worked on this day, none assigned to a brand.`);
    }
  }
  const perDay = new Map();
  for (const r of rows) { if (!r.emp || !r.iso) continue; const k = r.email + '|' + r.iso; if (!perDay.has(k)) perDay.set(k, []); perDay.get(k).push(r); }
  for (const g of perDay.values()) { const h = sum(g.map(r => r.hours || 0)); if (h > 12) add('warn', g[0], 'More than 12 hours in one day', `${fmtH(h)} recorded. Please check.`); }
  const order = {crit: 0, warn: 1, info: 2};
  return iss.sort((a, b) => order[a.sev] - order[b.sev] || a.week.localeCompare(b.week) || a.iso.localeCompare(b.iso) || String(a.emp).localeCompare(String(b.emp)));
}
function issueKey(i) {
  const s = [i.dept, i.week, i.iso, i.emp, i.msg, i.det].join('|'); let h = 5381;
  for (let k = 0; k < s.length; k++) h = ((h << 5) + h + s.charCodeAt(k)) >>> 0;
  return 'i' + h.toString(36);
}
function issueMailLink(i, to) {
  const e = peopleList().find(x => x.email.toLowerCase() === String(i.email || '').toLowerCase()) || {name: i.emp};
  const when = `week ${i.kw}${i.iso ? `, ${fmtDate(new Date(i.iso))}` : ''}`;
  const body = `Hi${firstName(e) ? ' ' + firstName(e) : ''},\n\nwhile checking the hours report I noticed something in your entries (${when}):\n\n${i.msg}\n${i.det}\n\nCould you please check this and correct it in Brand Time? If everything is right, just let me know.\n${REPORT_URL()}\n\nThanks!`;
  return outlookLink(to, `Question about your hours, ${when}`, body);
}

/* ---------- building blocks ---------- */
function kpi(label, value, sub, hero) { return `<div class="kpi${hero ? ' hero' : ''}"><span class="label">${esc(label)}</span><span class="v">${value}</span>${sub ? `<span class="s">${sub}</span>` : ''}</div>`; }
function groupBars(list) {
  if (!list.length) return `<div class="empty">No hours in the selected period.</div>`;
  const G = groupsOf(list, true);
  const max = Math.max(1, ...G.map(g => g.total)); const tot = sum(G.map(g => g.total));
  const bar = (x, red, grey) => `<span class="track">${x.direct > 0 ? `<span class="${red ? 'seg-r' : grey ? 'seg-u' : 'seg-d'}" style="width:${x.direct / max * 100}%"></span>` : ''}${x.alloc > 0.05 ? `<span class="${red ? 'seg-ru' : 'seg-u'}" style="width:${x.alloc / max * 100}%"></span>` : ''}</span>`;
  const keep = S.settings.method === 'none';
  const tipOf = (n, x) => keep ? `${n}\n${fmtH(x.total)}${tot ? ` (${fmtPct(x.total / tot)})` : ''}` : `${n}\nDirect: ${fmtH(x.direct)}\nAllocated: ${fmtH(x.alloc)}\nTotal: ${fmtH(x.total)}${tot ? ` (${fmtPct(x.total / tot)})` : ''}`;
  const legend = keep
    ? `<span><i style="background:var(--red)"></i>Reploid</span><span><i style="background:var(--ink)"></i>Diverse brands</span><span><i style="background:var(--ink-3)"></i>General (no brand)</span>`
    : `<span><i style="background:var(--ink)"></i>Booked directly</span><span><i style="background:var(--ink-3)"></i>Share of General (allocated)</span><span><i style="background:var(--red)"></i>Reploid</span>`;
  return `<div class="legend">${legend}</div>
  <div class="hbars">${G.map(g => {
    const red = g.group === 'Reploid'; const grey = g.group === 'Allgemein'; const open = expandable(g) && S.open[g.group];
    let h = `<div class="hbar group ${red ? 'reploid' : ''}" data-tip="${esc(tipOf(g.label, g))}"><span class="n">${groupName(g)}</span>${bar(g, red, grey)}<span class="v">${fmtNum(g.total)} <small>${tot ? fmtPct(g.total / tot) : ''}</small></span></div>`;
    if (open) h += g.items.map(x => `<div class="hbar sub" data-tip="${esc(tipOf(x.brand, x))}"><span class="n">${esc(x.brand)}</span>${bar(x, red)}<span class="v">${fmtNum(x.total)} <small>${tot ? fmtPct(x.total / tot) : ''}</small></span></div>`).join('');
    return h;
  }).join('')}</div>${G.find(g => g.group === 'Reploid' && !g.total) ? '<p class="note">No hours are recorded for Reploid in this period. Book hours on the brand "REPLOID" in Brand Time.</p>' : ''}`;
}
function weekColumns(valueOf, isSel, title) {
  const ks = Array.from(new Set(ROWS.filter(counts).map(r => r.week))).sort();
  if (!ks.length) return '';
  const weeks = weekRange(ks[0], ks[ks.length - 1]);
  const vals = weeks.map(valueOf); const max = Math.max(...vals, 1);
  const maxIdx = vals.indexOf(Math.max(...vals));
  return `<div class="section"><div class="section-head"><h3>${esc(title)}</h3><span class="muted" style="font-size:.85rem">Red = selected period</span></div>
  <div><div class="cols">${weeks.map((w, i) => {
    const h = vals[i] / max * 100; const showT = isSel(w) || i === maxIdx;
    return `<div class="col ${isSel(w) ? 'sel' : ''}" data-tip="${esc(`Week ${kwOf(w)}\n${fmtH(vals[i])}`)}">${showT ? `<span class="t" style="bottom:calc(${h}% + 4px)">${fmtNum(vals[i], 0)}</span>` : ''}<span class="b" style="height:${h}%"></span></div>`;
  }).join('')}</div><div class="col-labels">${weeks.map(w => `<span>W${kwOf(w)}</span>`).join('')}</div></div></div>`;
}
const selWeek = w => S.mode === 'all' || (S.mode === 'week' ? w === S.period : ROWS.some(r => counts(r) && r.week === w && r.month === S.period));
function brandTable(res, weeks) {

  <p class="note">Hours per department, with the share of that department's hours underneath. Example: "General" in Operations at 90 % means 90 % of Operations hours had no direct brand link.${um ? ' Including allocated general hours.' : ''}${res.unallocated ? ` ${fmtH(res.unallocated)} could not be allocated because no brand had any directly booked hours.` : ''}</p>`;

function topTopics(rows, n = 3) {
  const m = new Map();

function uncountedHours() {

function investorText(mode, p) {
  const rows = periodRows(mode, p); const res = allocate(rows);
  const list = res.list.filter(x => inInvestor(x.brand)); const tot = sum(list.map(x => x.total));
  if (!tot) return 'There are no hours for this period yet.';
  const [R, D] = groupsOf(list, false);
  const join = a => a.length > 1 ? a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1] : (a[0] || '');
  let t = `${cap1(periodName(mode, p))} the Alimentastic team logged ${fmtNum(tot, 0)} hours. `;

  } else t += 'No hours were booked directly on Reploid in this period. ';
  if (D.total) t += `Diverse other brands accounted for ${fmtNum(D.total, 0)} hours (${fmtPct(D.total / tot)}), mainly ${join(D.items.slice(0, 3).map(x => `${x.brand} (${fmtNum(x.total, 0)} h)`))}. `;

}
function viewInvestor() {

    ${rates ? `<tr><td class="muted">Cost Reploid</td>${cells(mr => fmtEur(costOf(gOf(mr, 'Reploid').byDept)), 'muted')}<td class="r muted">${fmtEur(sum(mres.map(mr => costOf(gOf(mr, 'Reploid').byDept))))}</td></tr>

function empGrid(list, weeks, only) {
  const rows = [];
  const menu = (e, w, cls, label, tip) => S.cellMenu === e.id + '|' + w
    ? `<td><span class="cellmenu"><button class="btn small" data-action="exc-set" data-e="${esc(e.id)}" data-w="${w}" data-r="Vacation">Vacation</button><button class="btn small" data-action="exc-set" data-e="${esc(e.id)}" data-w="${w}" data-r="No reason given" title="No reason given">n/a</button></span></td>`
    : `<td><button class="cell ${cls}" data-action="cell-menu" data-e="${esc(e.id)}" data-w="${w}" data-tip="${esc(tip)}">${label}</button></td>`;
  const shown = list.filter(e => e.required && (!only || only.has(e.id)));
  if (!shown.length) return `<div class="empty">Nobody has open weeks.</div>`;
  let lastDept = null;
  for (const e of shown) {
    if (e.dept !== lastDept) { rows.push(`<tr class="grp"><td colspan="${weeks.length + 1}">${esc(e.dept || NO_TEAM)}</td></tr>`); lastDept = e.dept; }
    const miss = weeks.filter(w => empStatus(e, w).s === 'late');
    rows.push(`<tr><td><span class="namecell"><span>${esc(e.name)}</span>${miss.length ? remindLinks(e, miss) : ''}</span></td>${weeks.map(w => {
      const st = empStatus(e, w);
      if (st.s === 'ok' && st.h < 0.5) return `<td><span class="cell exc" data-tip="${esc(`${e.name}, week ${kwOf(w)}: excused\nSubmitted with no hours (leave or similar)`)}">excused</span></td>`;
      if (st.s === 'ok') return `<td><span class="cell ${st.late ? 'lateok' : 'ok'}" data-tip="${esc(`${e.name}, week ${kwOf(w)}: ${fmtH(st.h)} submitted${st.at ? `\n${fmtTime(st.at)}` : ''}${st.late ? '\nsubmitted after the deadline' : ''}`)}">${fmtNum(st.h, 0)} h</span></td>`;
      if (st.s === 'exc') return `<td><button class="cell exc" data-action="exc-clear" data-e="${esc(e.id)}" data-w="${w}" data-tip="${esc(`${e.name}, week ${kwOf(w)}: excused (${st.x.reason})${st.x.note ? '\n' + st.x.note : ''}\nClick to reset`)}">excused</button></td>`;
      if (st.s === 'inactive') return `<td><span class="cell inactive" data-tip="${esc(`${e.name}: not employed in week ${kwOf(w)}`)}">·</span></td>`;
      if (st.s === 'late') return menu(e, w, 'late', 'missing', `${e.name}, week ${kwOf(w)}: not submitted${st.draft ? `\n${fmtH(st.h)} entered but the week was not submitted` : ''}\nClick to mark`);
      if (st.s === 'due') return menu(e, w, 'due', 'today', `${e.name}, week ${kwOf(w)}: due today\nClick to mark, e.g. for leave`);
      return `<td><span class="cell open">–</span></td>`;
    }).join('')}</tr>`);
  }
  return `<div class="tbl-wrap"><table class="grid-status"><thead><tr><th>Employee</th>${weeks.map(w => `<th class="r" style="text-align:center">W${kwOf(w)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
}
function excEditor(list) {

function viewCheck() {

/* ---------- Excel exports (same look as the other Brand Time workbooks) ---------- */
const XL = {
  fill: {type: 'pattern', pattern: 'solid', fgColor: {argb: 'FF1F1F1F'}},
  head: {bold: true, color: {argb: 'FFFFFFFF'}, name: 'Arial', size: 11},
  base: {name: 'Arial', size: 11}, bold: {name: 'Arial', size: 11, bold: true},
  title: {bold: true, color: {argb: 'FFD6001C'}, name: 'Arial', size: 14}
};
function aoaSheet(wb, name, aoa, widths, headers, title) {
  headers = headers || [];
  const ws = wb.addWorksheet(name);
  widths.forEach((w, i) => { ws.getColumn(i + 1).width = w; });
  aoa.forEach((row, ri) => {
    const r = ws.addRow(row);
    const first = String(row[0] == null ? '' : row[0]);
    const strong = first === 'Total' || (/[A-Z]/.test(first) && first === first.toUpperCase() && first === first.trim() && first.length > 2);
    r.eachCell({includeEmpty: false}, c => { c.font = strong ? XL.bold : XL.base; });
    if (title && ri === 0) r.getCell(1).font = XL.title;
    if (headers.includes(ri)) r.eachCell({includeEmpty: true}, (c, n) => { if (n <= widths.length) { c.fill = XL.fill; c.font = XL.head; } });
  });
  if (headers.length) ws.views = [{state: 'frozen', ySplit: headers[0] + 1}];
  return ws;
}
function overviewAoa(mode, p, onlyInvestor) {
  const rows = periodRows(mode, p); const res = allocate(rows);
  const list = onlyInvestor ? res.list.filter(x => inInvestor(x.brand)) : res.list;
  const ds = deptsAll().filter(d => list.some(x => x.byDept[d])); const rates = hasRates();
  const tot = sum(list.map(x => x.total));
  const head = ['Reploid / brand', ...ds, 'Direct', 'Allocated', 'Total h', 'Share %', ...(rates ? ['Cost €'] : [])];
  const line = (name, x) => [name, ...ds.map(d => round2(x.byDept[d] || 0)), round2(x.direct), round2(x.alloc), round2(x.total), tot ? round2(x.total / tot * 100) : 0, ...(rates ? [Math.round(costOf(x.byDept))] : [])];
  const body = [];
  for (const g of groupsOf(list, !onlyInvestor)) {
    body.push(line(g.label.toUpperCase(), g));
    if (expandable(g)) for (const x of g.items) body.push(line('    ' + x.brand, x));
  }
  const totalRow = ['Total', ...ds.map(d => round2(sum(list.map(x => x.byDept[d] || 0)))), round2(sum(list.map(x => x.direct))), round2(sum(list.map(x => x.alloc))), round2(tot), 100, ...(rates ? [Math.round(sum(list.map(x => costOf(x.byDept))))] : [])];
  return [[`Hours report ${periodName(mode, p).replace(/^(in|from) /, '')}`], [methodLabel()], [], head, ...body, totalRow];
}
function monthsAoa(onlyInvestor) {
  const months = Array.from(new Set(ROWS.filter(counts).map(r => r.month))).sort();
  const mres = months.map(m => { const l = allocate(periodRows('month', m)).list; return {m, G: groupsOf(onlyInvestor ? l.filter(y => inInvestor(y.brand)) : l, !onlyInvestor)}; });
  const gs = onlyInvestor ? ['Reploid', 'Diverse', 'Allgemein'] : ['Reploid', 'Diverse', 'Allgemein', 'aus'];
  const gOf = (mr, g) => mr.G.find(z => z.group === g) || {total: 0, items: [], byDept: {}};
  const out = [['Hours', ...months.map(monthLabel), 'Total']];
  for (const g of gs) {
    const gT = mres.map(mr => gOf(mr, g).total); if (g === 'aus' && !sum(gT)) continue;
    out.push([GROUP_LABEL[g].toUpperCase(), ...gT.map(round2), round2(sum(gT))]);
    const names = Array.from(new Set(mres.flatMap(mr => gOf(mr, g).items.map(x => x.brand))));
    if (expandable({group: g, items: names.map(b => ({brand: b}))})) for (const b of names) {
      const v = mres.map(mr => (gOf(mr, g).items.find(x => x.brand === b) || {}).total || 0);
      out.push(['    ' + b, ...v.map(round2), round2(sum(v))]);
    }
  }
  const mt = mres.map(mr => sum(gs.map(g => gOf(mr, g).total)));
  out.push(['Total', ...mt.map(round2), round2(sum(mt))]);
  for (const g of ['Reploid', 'Diverse', 'Allgemein']) {
    const v = mres.map(mr => gOf(mr, g).total); if (g === 'Allgemein' && !sum(v)) continue;
    out.push([`Share ${g === 'Diverse' ? 'diverse brands' : g === 'Allgemein' ? 'General' : g} %`, ...mres.map((mr, i) => mt[i] ? round2(v[i] / mt[i] * 100) : 0), sum(mt) ? round2(sum(v) / sum(mt) * 100) : 0]);
  }
  if (hasRates()) {
    out.push(['Cost Reploid €', ...mres.map(mr => Math.round(costOf(gOf(mr, 'Reploid').byDept)))]);
    out.push(['Cost total €', ...mres.map(mr => Math.round(sum(gs.map(g => costOf(gOf(mr, g).byDept)))))]);
  }
  return out;
}

async function saveWorkbook(wb, filename) {

}

/* ---------- copy, notices ---------- */
function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => el.hidden = true, 2600); }
function copyText(t) {

  try { navigator.clipboard.writeText(t).then(() => toast('Copied'), fallback); } catch (e) { fallback(); }
}
function tableToTsv(el) { return Array.from(el.querySelectorAll('tr')).map(tr => Array.from(tr.children).map(c => c.innerText.replace(/\s+/g, ' ').trim()).join('\t')).join('\n'); }

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const more = document.getElementById('exportBtn');
  if (more && more.open && !e.target.closest('.more summary')) setTimeout(() => { more.open = false; }, 0);
  const t = e.target.closest('[data-tab],[data-mode],[data-action]'); if (!t) return;
  if (t.dataset.tab) { S.tab = t.dataset.tab; render(); return; }
  if (t.dataset.mode) { S.mode = t.dataset.mode; S.period = defaultPeriod(); render(); return; }
  const a = t.dataset.action;
  if (a === 'export') exportAll();
  else if (a === 'export-investor') exportInvestor();

  else if (a === 'toggle-group') { S.open[t.dataset.g] = !S.open[t.dataset.g]; render(); }
  else if (a === 'reload') { loadData().then(() => { render(); toast('Data refreshed'); }).catch(err => toast(err.message)); }
  else if (a === 'copy-reminder') {
    const em = empMissing(peopleList(), shownWeeks(peopleList()));
    copyText('Hi,\n\nthe following weekly submissions are still missing in Brand Time:\n' + em.map(x => `- ${x.e.name}: week ${x.kws.map(kwOf).join(', week ')}`).join('\n') + '\n\nPlease enter the hours and submit the week. If you were on leave or off sick, just let me know. Thanks!');
  }
  else if (a === 'cell-menu') { const k = t.dataset.e + '|' + t.dataset.w; S.cellMenu = S.cellMenu === k ? null : k; render(); }
  else if (a === 'exc-set' || a === 'exc-clear') {
    S.cellMenu = null;
    const k = t.dataset.e + '|' + t.dataset.w; const m = Object.assign({}, S.excuses);
    if (a === 'exc-set') m[k] = {reason: t.dataset.r, note: '', by: S.me.email, at: new Date().toISOString()}; else delete m[k];
    S.excuses = m; saveExcuses();
    render(); toast(a === 'exc-set' ? `Week ${kwOf(t.dataset.w)}: excused (${t.dataset.r})` : `Week ${kwOf(t.dataset.w)}: open again`);
  }
  else if (a === 'exc-edit') { S.excEdit = {e: t.dataset.e, w: t.dataset.w}; S.tab = 'review'; render(); const p = document.getElementById('excPanel'); if (p) p.scrollIntoView({block: 'center', behavior: 'smooth'}); }
  else if (a === 'exc-cancel') { S.excEdit = null; render(); }
  else if (a === 'exc-save' || a === 'exc-delete') {
    const from = document.getElementById('excFrom').value, to = document.getElementById('excTo').value;
    const reason = document.getElementById('excReason').value, note = document.getElementById('excNote').value.trim();
    if (a === 'exc-save' && reason === 'Other' && !note) { toast('Please add a note for “Other”'); return; }
    if (to < from) { toast('“to” cannot be before “from”'); return; }
    const m = Object.assign({}, S.excuses);
    for (const w of weekRange(from, to)) { const k = S.excEdit.e + '|' + w; if (a === 'exc-delete') delete m[k]; else m[k] = {reason, note, by: S.me.email, at: new Date().toISOString()}; }
    S.excuses = m; saveExcuses();
    S.excEdit = null; render(); toast(a === 'exc-save' ? 'Reason saved' : 'Reason removed');
  }
  else if (a === 'copy') copyText(document.getElementById(t.dataset.target).innerText);
  else if (a === 'copy-table') { const el = document.getElementById(t.dataset.target).querySelector('table'); if (el) copyText(tableToTsv(el)); }
  else if (a === 'ack' || a === 'unack') {
    const m = Object.assign({}, S.acks);
    if (a === 'ack') m[t.dataset.k] = {by: S.me.email, at: new Date().toISOString()}; else delete m[t.dataset.k];
    S.acks = m; saveAcks(); render(); toast(a === 'ack' ? 'Marked as all good' : 'Open again');
  }
  else if (a === 'toggle-acked') { S.showAcked = !S.showAcked; render(); }
  else if (a === 'copy-issues') copyText(ISSUES.filter(i => i.sev !== 'info').map(i => `${i.dept}, week ${i.kw}, ${i.iso ? fmtDate(new Date(i.iso)) : ''} ${i.emp}: ${i.msg}. ${i.det}`).join('\n') || 'No open items.');
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'startWeek') { S.settings.startWeek = t.value; saveSettings(); render(); toast(`Tracking from week ${kwOf(t.value)}`); return; }
  if (t.id === 'autoAssign') { S.settings.autoAssign = t.checked; saveSettings(); render(); toast(t.checked ? 'Automatic assignment on' : 'Automatic assignment off'); return; }
  if (t.id === 'includeDrafts') { S.settings.includeDrafts = t.checked; saveSettings(); render(); toast(t.checked ? 'Unsubmitted weeks are now counted' : 'Only submitted weeks are counted'); return; }
  if (t.id === 'onlyMissing') { S.onlyMissing = t.checked; render(); return; }
  if (t.dataset.pe != null) {
    const em = t.dataset.pe; const f = t.dataset.f; const cur = Object.assign({}, S.people[em]);
    if (f === 'required') cur.required = t.checked; else if (f === 'name') { const v = t.value.trim().replace(/\s+/g, ' '); if (v) cur.name = v; else delete cur.name; } else if (f === 'team') { if (t.value) cur.team = t.value; else delete cur.team; } else cur[f] = t.value;
    S.people = Object.assign({}, S.people, {[em]: cur}); savePeople(); render(); return;
  }
  if (t.id === 'periodSel') { S.period = t.value; render(); }
  else if (t.id === 'brandSel') { S.brandSel = t.value; render(); }
  else if (t.id === 'hideNames') { S.settings.hideNames = t.checked; saveSettings(); render(); }
  else if (t.name === 'method') { S.settings.method = t.value; saveSettings(); render(); }
  else if (t.dataset.rate) { const v = parseFloat(String(t.value).replace(',', '.')); S.settings.rates[t.dataset.rate] = v > 0 ? v : null; saveSettings(); render(); }
  else if (t.dataset.bset) {
    const k = t.dataset.k; const c = Object.assign({name: t.dataset.name}, S.settings.brands[k]);
    const b = t.dataset.bset;
    if (b === 'group') c.group = t.value;
    else if (b === 'kind') c.kind = t.value;
    else if (b === 'alias') { if (t.value) c.alias = t.value; else delete c.alias; }
    else { const v = parseFloat(String(t.value).replace(',', '.')); c.key = v > 0 ? v : null; }
    S.settings.brands[k] = c; saveSettings(); render();
  }
});
document.addEventListener('input', e => { if (e.target.id === 'q') { S.q = e.target.value; renderDataTable(); } });
const tip = document.getElementById('tip');
document.addEventListener('mouseover', e => { const t = e.target.closest('[data-tip]'); if (!t) { tip.hidden = true; return; } tip.textContent = t.dataset.tip; tip.hidden = false; });
document.addEventListener('mousemove', e => { if (tip.hidden) return; const x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8); tip.style.left = x + 'px'; tip.style.top = (e.clientY + 16) + 'px'; });
document.addEventListener('mouseleave', () => tip.hidden = true);

/* ---------- start ---------- */
async function init() {
  render();
  try { await loadData(); rebuild(); S.period = defaultPeriod(); S.ready = true; } catch (e) { S.error = e.message || 'The report could not be loaded.'; }
  render();
}
// When shown inside Brand Time, tell the page around us how tall we are so it can size the frame to fit
if (window.parent !== window && window.ResizeObserver) {
  const sendHeight = () => { try { parent.postMessage({type: 'rpt-height', h: Math.ceil(document.body.getBoundingClientRect().height)}, location.origin); } catch (e) {} };
  new ResizeObserver(sendHeight).observe(document.body); sendHeight();
}
init();

</script>
