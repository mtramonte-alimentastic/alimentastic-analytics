<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brand Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>

:root{
  --red:#D6001C;
  --ink:#000000;
  --paper:#FFFFFF;
  --surface:#F4F4F4;
  --surface2:#EBEBEB;
  --rule:#DEDEDE;
  --muted:#6B6B6B;
  --ok:#1F7A3D;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --red:#FF3B4E; --ink:#F2F2F2; --paper:#101010; --surface:#191919;
    --surface2:#232323; --rule:#2E2E2E; --muted:#9A9A9A; --ok:#4FBE77;
  }
}
:root[data-theme="dark"]{
  --red:#FF3B4E; --ink:#F2F2F2; --paper:#101010; --surface:#191919;
  --surface2:#232323; --rule:#2E2E2E; --muted:#9A9A9A; --ok:#4FBE77;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:Archivo,"Helvetica Neue",Arial,sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.wrap{max-width:860px;margin:0 auto;padding:0 16px 64px}
.wrap.wide{max-width:1240px}
.rptwrap{margin:0 -16px}
.rptframe{display:block;width:100%;height:900px;min-height:480px;border:0;background:transparent}

/* ---------- masthead ---------- */
.mast{display:flex;align-items:baseline;gap:10px;padding:20px 0 14px;border-bottom:2px solid var(--ink)}
.mark{font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:15px}
.mark .dot{color:var(--red)}
.mast .who{margin-left:auto;font-size:12.5px;color:var(--muted)}

/* ---------- tabs ---------- */
nav.tabs{display:flex;gap:2px;margin:0 -16px;padding:0 16px;overflow-x:auto;border-bottom:1px solid var(--rule)}
nav.tabs button{
  background:none;border:0;padding:11px 12px;cursor:pointer;white-space:nowrap;
  font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;
}
nav.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--red)}

/* ---------- week bar ---------- */
.weeknav{display:flex;align-items:center;gap:8px;padding:18px 0 6px}
.weeknav h1{font-size:19px;font-weight:800;margin:0;letter-spacing:-.01em}
.weeknav .sub{font-size:12.5px;color:var(--muted);margin-left:2px}
.nudge{margin-left:auto;display:flex;gap:6px}
.nudge button{
  width:34px;height:34px;border:1px solid var(--rule);background:var(--paper);
  border-radius:2px;cursor:pointer;font-size:15px;line-height:1;
}
.nudge button:hover{border-color:var(--ink)}
.nudge .today{width:auto;padding:0 12px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}

/* ---------- hero gauge ---------- */
.gauge{margin:14px 0 22px;padding:16px 0 0;border-top:1px solid var(--rule)}
.gauge .top{display:flex;align-items:flex-end;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.gauge .pct{font-size:44px;font-weight:800;line-height:.9;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.gauge .pct.hit{color:var(--red)}
.gauge .lbl{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-bottom:4px}
.gauge .alt{margin-left:auto;font-size:12.5px;color:var(--muted);text-align:right;padding-bottom:4px}
.gauge .alt b{color:var(--ink);font-variant-numeric:tabular-nums}
.track{position:relative;height:26px;background:var(--surface);border:1px solid var(--rule)}
.track .fill{position:absolute;inset:0 auto 0 0;background:var(--red)}
.track .tick{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink);left:80%}
.track .ticklbl{position:absolute;top:-19px;left:80%;transform:translateX(-50%);font-size:10.5px;font-weight:700;letter-spacing:.06em}

/* ---------- day rows ---------- */
.day{border-bottom:1px solid var(--rule)}
.day.weekend .dhead{opacity:.62}
.day.open{background:var(--surface);margin:0 -16px;padding:0 16px}
.dhead{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:13px 0;cursor:pointer;text-align:left}
.dhead .dname{width:108px;flex:0 0 auto;font-weight:600;font-size:13.5px}
.dhead .dname span{display:block;font-weight:400;font-size:11.5px;color:var(--muted)}
.dhead .bar{flex:1 1 auto;display:flex;height:11px;background:var(--surface2);min-width:60px;overflow:hidden}
.day.open .dhead .bar{background:var(--surface2)}
.seg{height:100%}
.seg.g-reploid{background:var(--red)}
.seg.g-external{background:var(--ink)}
.seg.g-internal{background:var(--muted);opacity:.5}
.dhead .hrs{flex:0 0 auto;width:62px;text-align:right;font-variant-numeric:tabular-nums;font-size:13.5px;font-weight:600}
.dhead .hrs em{font-style:normal;font-weight:400;color:var(--muted);font-size:11.5px}
.dhead .chev{flex:0 0 auto;width:14px;color:var(--muted);font-size:11px}

.dbody{padding:2px 0 18px}
.workedline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 0 14px}
.workedline label{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.stepper{display:flex;align-items:stretch;border:1px solid var(--rule);background:var(--paper)}
.stepper button{width:32px;border:0;background:none;cursor:pointer;font-size:16px;line-height:1;color:var(--muted)}
.stepper button:hover{color:var(--ink);background:var(--surface2)}
.stepper input{width:64px;border:0;background:none;text-align:center;font-variant-numeric:tabular-nums;font-weight:600;padding:7px 0}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper input[type=number]{-moz-appearance:textfield}
.stepper input.bad,.row .hbox input.bad{color:var(--red)}
.remain{font-size:12.5px;font-weight:600;padding:4px 8px;border:1px solid var(--rule);background:var(--paper)}
.remain.warn{color:var(--red);border-color:var(--red)}
.remain.done{color:var(--ok);border-color:var(--ok)}
.copyday{margin-left:auto;background:none;border:1px solid var(--rule);padding:6px 10px;cursor:pointer;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.copyday:hover{border-color:var(--ink);color:var(--ink)}

.rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:1fr 150px 92px 30px;gap:8px;align-items:center}
.row .note{grid-column:1 / -1;margin-top:-2px}
.row select,.row input[type=text]{
  width:100%;border:1px solid var(--rule);background:var(--paper);padding:8px 9px;border-radius:0;
}
.row .note input{font-size:13.5px;color:var(--muted)}
.row .hbox{display:flex;border:1px solid var(--rule);background:var(--paper)}
.row .hbox input{width:100%;border:0;background:none;text-align:right;padding:8px 6px;font-variant-numeric:tabular-nums;font-weight:600}
.row .hbox span{padding:8px 8px 8px 0;color:var(--muted);font-size:12.5px}
.row .del{border:0;background:none;cursor:pointer;color:var(--muted);font-size:17px;line-height:1}
.row .del:hover{color:var(--red)}
.row select.g-reploid{border-left:3px solid var(--red)}
.row select.g-external{border-left:3px solid var(--ink)}
.row select.g-internal{border-left:3px solid var(--muted)}

.addline{display:flex;gap:8px;align-items:stretch;margin-top:14px}
.addline select{flex:1 1 auto;border:1px solid var(--rule);background:var(--paper);padding:9px 10px}
.dayfoot{margin-top:16px;padding-top:14px;border-top:1px solid var(--rule);display:flex;justify-content:flex-end}

.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{border:1px solid var(--rule);background:var(--paper);padding:6px 10px;cursor:pointer;font-size:13px;border-radius:0}

.switch{position:relative;display:inline-block;width:36px;height:20px;vertical-align:middle}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.switch .track{position:absolute;inset:0;background:var(--surface2);border:1px solid var(--rule);transition:background-color .15s,border-color .15s}
.switch .track::before{content:"";position:absolute;height:14px;width:14px;left:2px;top:2px;background:var(--paper);border:1px solid var(--rule);transition:transform .15s}
.switch input:checked + .track{background:var(--ok);border-color:var(--ok)}
.switch input:checked + .track::before{transform:translateX(16px);border-color:var(--ok)}
.switch input:focus-visible + .track{outline:2px solid var(--red);outline-offset:2px}
.chip:hover{border-color:var(--ink)}
.chip.g-reploid{border-left:3px solid var(--red)}
.chip.g-external{border-left:3px solid var(--ink)}
.chip.g-internal{border-left:3px solid var(--muted)}

/* ---------- footer actions ---------- */
.foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:22px 0 0;border-top:2px solid var(--ink);margin-top:20px}
.btn{
  background:var(--red);color:#fff;border:0;padding:12px 22px;cursor:pointer;
  font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;border-radius:0;
}
.btn:disabled{background:var(--surface2);color:var(--muted);cursor:default}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--rule);font-weight:600}
.btn.ghost:hover{border-color:var(--ink)}
.status{font-size:12.5px;color:var(--muted)}
.status.saved{color:var(--ok)}
.status.err{color:var(--red)}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{
  text-align:left;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);padding:8px 8px 8px 0;border-bottom:1px solid var(--ink);white-space:nowrap;
}
td{padding:9px 8px 9px 0;border-bottom:1px solid var(--rule);vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;padding-right:0}
tr.total td{border-bottom:0;border-top:2px solid var(--ink);font-weight:700}
.miss{color:var(--red);font-size:12px;font-weight:600}
.mini{height:8px;background:var(--surface2);display:flex;min-width:70px;margin-top:5px}

.panel{padding:20px 0}
.panel h2{font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;margin:0 0 4px}
.panel p.lede{color:var(--muted);font-size:13.5px;margin:0 0 18px;max-width:62ch}
.field{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.field input[type=text],.field input[type=date],.field select{border:1px solid var(--rule);background:var(--paper);padding:9px 10px}
.field input[type=text]{min-width:190px;flex:1 1 190px}
.note-box{border-left:3px solid var(--red);padding:10px 0 10px 13px;margin:16px 0;font-size:13px;color:var(--muted);max-width:66ch}
.empty{padding:34px 0;color:var(--muted);font-size:14px;max-width:56ch}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);padding:12px 0 0}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
.closedbar{border-left:3px solid var(--ok);padding:10px 0 10px 13px;margin:14px 0 4px;font-size:13.5px}
.privacy{font-size:12px;color:var(--muted);padding:10px 0 0;max-width:60ch}
.spin{padding:60px 0;text-align:center;color:var(--muted);font-size:13.5px}

@media (max-width:620px){
  .row{grid-template-columns:1fr 78px 28px}
  .row select.task{grid-column:1 / 3}
  .dhead .dname{width:82px}
  .gauge .pct{font-size:36px}
  .gauge .alt{margin-left:0;width:100%;text-align:left}
}


/* ---------- login ---------- */
.login{max-width:380px;margin:0 auto;padding:56px 0 40px}
.login h1{font-size:22px;font-weight:800;margin:0 0 6px;letter-spacing:-.01em}
.login p.lede{color:var(--muted);font-size:13.5px;margin:0 0 26px}
.login label{display:block;font-size:11.5px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);margin:0 0 5px}
.login input,.login select{width:100%;border:1px solid var(--rule);background:var(--paper);
  padding:11px 12px;margin-bottom:14px}
.login .btn{width:100%;padding:13px}
.login .swap{background:none;border:0;color:var(--muted);font-size:12.5px;
  cursor:pointer;padding:16px 0 0;text-decoration:underline;display:block}
.login .msg{font-size:13px;margin:14px 0 0}
.login .msg.err{color:var(--red)}
.login .msg.ok{color:var(--ok)}

/* ---------- misc ---------- */
.mast .out{background:none;border:0;color:var(--muted);font-size:12px;
  cursor:pointer;text-decoration:underline;padding:0 0 0 10px}

</style>

</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="mark">Brand Time<span class="dot">.</span></div>
    <div class="who" id="who"></div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="main"><div class="spin">Loading…</div></main>
</div>
<script>
(function(){
"use strict";

/* ===================== state ===================== */
var S = {
  me:null, admin:false,
  cfg:{brands:[],tasks:[]},
  week:null,
  doc:{days:{},submitted:false,dailyDefault:8},
  myName:"",
  open:null, view:"week",
  team:null, teamWeek:null, people:null,
  dirty:false, saving:false, savedAt:null, error:null,
  closed:false, lostChange:false,
  needsTeam:false, teams:[], teamOptions:null, teamFilter:"",
  ready:false, authed:false, authMode:"login"
};

var GROUPS = [
  {id:"reploid",  label:"REPLOID brand"},
  {id:"external", label:"External / white-label"},
  {id:"internal", label:"Internal / overhead"}
];

/* ===================== api ===================== */
function call(base,op,body){
  var opts={method:body?"POST":"GET",credentials:"same-origin",
    headers:{"Content-Type":"application/json"}};
  if(body)opts.body=JSON.stringify(body);
  return fetch(base+"?op="+op,opts).then(function(r){
    return r.text().then(function(txt){
      var j={}; try{ j=txt?JSON.parse(txt):{}; }catch(e){ j={error:txt.slice(0,160)}; }
      if(!r.ok){ var err=new Error(j.error||("HTTP "+r.status)); err.status=r.status; err.data=j; throw err; }
      return j;
    });
  });
}
function api(op,body){ return call("/api",op,body); }
function auth(op,body){ return call("/auth",op,body); }

/* ===================== date helpers ===================== */
function pad(n){return String(n).padStart(2,"0");}
function isoWeekOf(d){
  var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  var day=t.getUTCDay()||7;
  t.setUTCDate(t.getUTCDate()+4-day);
  var y=t.getUTCFullYear();
  var jan1=Date.UTC(y,0,1);
  var wk=Math.ceil(((t.getTime()-jan1)/86400000+1)/7);
  return y+"-W"+pad(wk);
}
function mondayOf(weekId){
  var p=weekId.split("-W"), y=+p[0], w=+p[1];
  var jan4=new Date(Date.UTC(y,0,4));
  var day=jan4.getUTCDay()||7;
  var mon=new Date(jan4.getTime());
  mon.setUTCDate(jan4.getUTCDate()-day+1+(w-1)*7);
  return mon;
}
function weekDays(weekId){
  var m=mondayOf(weekId), out=[];
  for(var i=0;i<7;i++){
    var d=new Date(m.getTime()); d.setUTCDate(m.getUTCDate()+i);
    out.push({
      key:d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate()),
      short:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"][i],
      label:pad(d.getUTCDate())+"."+pad(d.getUTCMonth()+1)+".",
      weekend:i>4, idx:i
    });
  }
  return out;
}
function shiftWeek(weekId,delta){
  var m=mondayOf(weekId); m.setUTCDate(m.getUTCDate()+delta*7);
  return isoWeekOf(new Date(m.getUTCFullYear(),m.getUTCMonth(),m.getUTCDate()));
}
function weekRangeLabel(weekId){
  var d=weekDays(weekId);
  return d[0].label+" – "+d[6].label+" "+mondayOf(weekId).getUTCFullYear();
}
function isoDate(d){return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate());}
function r1(n){return Math.round(n*10)/10;}
function r2(n){return Math.round(n*100)/100;}

/* ===================== time entry =====================
   Hours are stored as decimal hours (so reports and Excel keep working) but are always a whole number of
   minutes. Everything on the entry screen is calculated in integer minutes, so sums never drift. */
function toMin(h){ return Math.round((+h||0)*60); }
function fromMin(m){ return Math.round(m/60*1e6)/1e6; }
function fmtMin(m){ var sign=m<0?"-":""; m=Math.abs(Math.round(m)); return sign+Math.floor(m/60)+":"+pad(m%60); }
function fmtHM(h){ return fmtMin(toMin(h)); }
/* Accepts 7:30, 7.5 / 7,5 (decimal hours), 8 (hours), 1h30, 1h 30m, 1h, 45m. Returns minutes, or null. */
function parseTime(str){
  var s=String(str==null?"":str).trim().toLowerCase().replace(/\s+/g," ").replace(",",".");
  if(!s)return null;
  var m,min=null;
  if((m=s.match(/^(\d{1,2}):(\d{1,2})$/))){ if(+m[2]<60)min=+m[1]*60+(+m[2]); }
  else if((m=s.match(/^(\d+(?:\.\d+)?)$/))){ min=Math.round(parseFloat(m[1])*60); }
  else if((m=s.match(/^(\d+)\s*h(?:\s*(\d{1,2})\s*(?:m|min)?)?$/))){ if(m[2]===undefined||+m[2]<60)min=+m[1]*60+(m[2]?+m[2]:0); }
  else if((m=s.match(/^(\d+)\s*(?:m|min)$/))){ min=+m[1]; }
  if(min===null||min>1440)return null;
  return min;
}
/* A text field that takes a time as h:mm. getH/setH read and write decimal hours (null = empty). */
function timeField(getH,setH,o){
  var inp=el("input",{type:"text",inputmode:"text",autocomplete:"off",spellcheck:"false",
    placeholder:o.placeholder||"h:mm","aria-label":o.label,title:"Enter the time as h:mm, for example 7:30 (7.5 and 1h30 also work)"});
  var cur=getH(); inp.value=(cur===null||cur===undefined)?"":fmtHM(cur);
  inp.addEventListener("input",function(){
    var raw=inp.value.trim();
    if(raw===""){ inp.classList.remove("bad"); if(o.allowEmpty)setH(null); return; }
    var m=parseTime(raw);
    if(m===null){ inp.classList.add("bad"); return; }     // still typing, or not a time: keep the last good value
    inp.classList.remove("bad"); setH(fromMin(m));
  });
  inp.addEventListener("blur",function(){
    var raw=inp.value.trim(); inp.classList.remove("bad");
    if(raw===""){ if(o.allowEmpty){ setH(null); inp.value=""; } else { setH(0); inp.value=fmtMin(0); } return; }
    var m=parseTime(raw);
    if(m===null){ var c=getH(); inp.value=(c===null||c===undefined)?"":fmtHM(c); flash("Please enter the time as h:mm, for example 7:30."); return; }
    inp.value=fmtMin(m); setH(fromMin(m));
  });
  inp.addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); inp.blur(); } });
  return inp;
}
function dayAllocatedMin(key){ return dayRows(key).reduce(function(sum,r){return sum+toMin(r.h);},0); }
function dayRemainMin(key){ var w=dayWorked(key); return (w===null?0:toMin(w))-dayAllocatedMin(key); }
function remainText(rem){ return rem===0?"Fully assigned":(rem>0?fmtMin(rem)+" left":fmtMin(-rem)+" over"); }

/* ===================== tiny dom ===================== */
function el(tag,attrs,kids){
  var n=document.createElement(tag);
  if(attrs) for(var k in attrs){
    if(k==="class")n.className=attrs[k];
    else if(k==="text")n.textContent=attrs[k];
    else if(k.slice(0,2)==="on")n.addEventListener(k.slice(2),attrs[k]);
    else if(attrs[k]!==null&&attrs[k]!==undefined)n.setAttribute(k,attrs[k]);
  }
  (kids||[]).forEach(function(c){ if(c) n.appendChild(c); });
  return n;
}
function clear(n){while(n.firstChild)n.removeChild(n.firstChild);}

/* ===================== domain helpers ===================== */
function brandById(id){
  var b=(S.cfg.brands||[]).filter(function(x){return x.id===id;})[0];
  return b||{id:id,name:id||"(unknown)",group:"internal"};
}
function activeBrands(){return (S.cfg.brands||[]).filter(function(b){return !b.archived;});}
function dayRows(key){ var d=S.doc.days[key]; return (d&&d.rows)||[]; }
function dayWorked(key){
  var d=S.doc.days[key];
  return (d&&typeof d.worked==="number")?d.worked:null;
}
function dayAllocated(key){ return dayRows(key).reduce(function(s,r){return s+(+r.h||0);},0); }
function ensureDay(key){
  if(!S.doc.days[key])S.doc.days[key]={worked:null,rows:[]};
  if(!S.doc.days[key].rows)S.doc.days[key].rows=[];
  return S.doc.days[key];
}
function weekTotals(doc){
  var t={worked:0,reploid:0,external:0,internal:0,allocated:0};
  var days=(doc&&doc.days)||{};
  Object.keys(days).forEach(function(k){
    var d=days[k]||{};
    t.worked+=(+d.worked||0);
    (d.rows||[]).forEach(function(r){
      var h=+r.h||0; t.allocated+=h;
      var g=brandById(r.b).group; t[g]=(t[g]||0)+h;
    });
  });
  return t;
}
function shares(t){
  var facing=t.reploid+t.external;
  return {
    ofWorked: t.worked>0 ? t.reploid/t.worked*100 : 0,
    ofFacing: facing>0 ? t.reploid/facing*100 : 0
  };
}

/* ===================== persistence ===================== */
var saveTimer=null, savePending=false;
function markDirty(){
  if(S.closed)return;
  S.dirty=true; setStatus();
  if(saveTimer)clearTimeout(saveTimer);
  saveTimer=setTimeout(save,1100);
}
function save(){
  if(S.closed)return Promise.resolve();
  if(S.saving){savePending=true;return Promise.resolve();}
  S.saving=true; S.error=null; setStatus();
  return api("week",{week:S.week,doc:{
    days:S.doc.days, submitted:!!S.doc.submitted,
    submittedAt:S.doc.submittedAt||null, dailyDefault:S.doc.dailyDefault||8
  }}).then(function(j){
    S.saving=false; S.dirty=false; S.savedAt=new Date();
    if(j&&j.closed)S.closed=true;          // this save was the one that completed the week
    if(S.closed){ savePending=false; render(); return; }
    if(savePending){savePending=false;return save();}
    setStatus();
  }).catch(function(e){
    S.saving=false; savePending=false;
    if(e.status===400&&e.data&&e.data.needsTeam){ S.needsTeam=true; S.dirty=false; return render(); }
    if(e.status===409){                    // the week closed while this page was open
      S.lostChange=S.dirty; S.dirty=false; S.closed=true;
      return loadWeek(S.week);
    }
    S.error = e.status===401
      ? "Your session expired. Reload the page and log in again — nothing on screen is lost yet."
      : "Not saved — "+e.message;
    setStatus();
  });
}
function setStatus(){
  var n=document.getElementById("saveStatus");
  if(!n)return;
  n.className="status";
  if(S.error){n.className="status err";n.textContent=S.error;}
  else if(S.saving){n.textContent="Saving…";}
  else if(S.dirty){n.textContent="Unsaved changes";}
  else if(S.savedAt){n.className="status saved";
    n.textContent="Saved "+pad(S.savedAt.getHours())+":"+pad(S.savedAt.getMinutes());}
  else n.textContent="";
}
function loadWeek(week){
  var keepClosed=S.closed&&week===S.week;   // arriving here from a 409: stay locked while reloading
  S.week=week; S.open=null; S.closed=keepClosed;
  if(!keepClosed)S.lostChange=false;
  S.doc={days:{},submitted:false,dailyDefault:S.doc.dailyDefault||8};
  render();
  return api("week&week="+encodeURIComponent(week)).then(function(j){
    var d=j.doc||{};
    S.doc={days:d.days||{},submitted:!!d.submitted,submittedAt:d.submittedAt||null,
           dailyDefault:d.dailyDefault||S.doc.dailyDefault||8};
    S.closed=keepClosed||!!j.closed;      // a refused save (409) is authoritative even if this read lags
    S.dirty=false; S.error=null; render();
  }).catch(function(e){ S.error="Could not load this week — "+e.message; render(); });
}
function flushThen(fn){ if(S.dirty){save().then(fn);} else fn(); }
function flash(msg){
  S.error=msg; setStatus();
  setTimeout(function(){ if(S.error===msg){S.error=null;setStatus();} },3500);
}

function renderDay(d){
  var worked=dayWorked(d.key), alloc=dayAllocated(d.key);
  var open=S.open===d.key;
  var wrap=el("div",{class:"day"+(d.weekend?" weekend":"")+(open?" open":"")});

  var bar=el("div",{class:"bar"});
  var base=Math.max(worked||0,alloc,0.0001);
  dayRows(d.key).forEach(function(r){
    var h=+r.h||0; if(h<=0)return;
    bar.appendChild(el("div",{class:"seg g-"+brandById(r.b).group,
      style:"width:"+(h/base*100)+"%"}));
  });
  wrap.appendChild(el("button",{class:"dhead","aria-expanded":open?"true":"false",
    onclick:function(){ S.open=open?null:d.key; if(!open)ensureDefault(d); render(); }},[
    el("div",{class:"dname"},[document.createTextNode(d.short),el("span",{text:d.label})]),
    bar,
    el("div",{class:"hrs"},[
      document.createTextNode(worked===null?"—":fmtHM(worked)+" h"),
      (worked!==null&&dayRemainMin(d.key)>0)?el("em",{text:" · "+fmtMin(dayRemainMin(d.key))+" left"}):null
    ]),
    el("div",{class:"chev",text:open?"▲":"▼"})
  ]));
  if(!open)return wrap;

  var body=el("div",{class:"dbody"});
  var remMin=dayRemainMin(d.key);
  var remainEl=el("div",{class:"remain"+(remMin===0?" done":" warn"),text:remainText(remMin)});

  var wInput=timeField(function(){return dayWorked(d.key);},function(h){
    ensureDay(d.key).worked=h; markDirty(); refreshRemain(d.key,remainEl);
  },{label:"Hours worked",allowEmpty:true});
  body.appendChild(el("div",{class:"workedline"},[
    el("label",{text:"Hours worked"}),
    el("div",{class:"stepper"},[
      el("button",{type:"button","aria-label":"15 minutes less",text:"−",onclick:function(){
        setWorked(d.key,fromMin(Math.max(0,toMin(dayWorked(d.key)||0)-15)));}}),
      wInput,
      el("button",{type:"button","aria-label":"15 minutes more",text:"+",onclick:function(){
        setWorked(d.key,fromMin(Math.min(1440,toMin(dayWorked(d.key)||0)+15)));}})
    ]),
    remainEl,
    el("button",{class:"copyday",text:"Copy previous day",onclick:function(){copyPrevDay(d);}})
  ]));

  var rowsWrap=el("div",{class:"rows"});
  dayRows(d.key).forEach(function(r,i){ rowsWrap.appendChild(renderRow(d,r,i,remainEl)); });
  body.appendChild(rowsWrap);

  var addSel=el("select",{"aria-label":"Brand to add"});
  activeBrands().forEach(function(b){
    addSel.appendChild(el("option",{value:b.id,text:b.name}));
  });
  body.appendChild(el("div",{class:"addline"},[
    addSel,
    el("button",{class:"btn ghost",text:"+ Add",onclick:function(){
      if(!addSel.value)return;
      var dd=ensureDay(d.key);
      var leftMin=toMin(dd.worked||0)-dayAllocatedMin(d.key);
      dd.rows.push({b:addSel.value,t:(S.cfg.tasks||[])[0]||"",h:leftMin>0?fromMin(leftMin):0,n:""});
      markDirty(); render();
    }})
  ]));

  var days=weekDays(S.week);
  var next=days[d.idx+1];
  body.appendChild(el("div",{class:"dayfoot"},[
    el("button",{class:"btn",text:next?"Save — next day":"Save",onclick:function(){
      save();
      S.open=next?next.key:null;
      if(next)ensureDefault(next);
      render();
    }})
  ]));

  wrap.appendChild(body);
  return wrap;
}

function renderRow(d,r,i,remainEl){
  var row=el("div",{class:"row"});
  var bsel=el("select",{class:"g-"+brandById(r.b).group,"aria-label":"Brand"});
  activeBrands().forEach(function(b){
    bsel.appendChild(el("option",{value:b.id,text:b.name,selected:b.id===r.b?"selected":null}));
  });
  if(r.b&&!activeBrands().some(function(b){return b.id===r.b;})){
    bsel.appendChild(el("option",{value:r.b,text:brandById(r.b).name+" (archived)",selected:"selected"}));
  }
  bsel.addEventListener("change",function(){ r.b=bsel.value; markDirty(); render(); });

  var tsel=el("select",{class:"task","aria-label":"Task"});
  tsel.appendChild(el("option",{value:"",text:"— task —"}));
  (S.cfg.tasks||[]).forEach(function(t){
    tsel.appendChild(el("option",{value:t,text:t,selected:t===r.t?"selected":null}));
  });
  tsel.addEventListener("change",function(){ r.t=tsel.value; markDirty(); });

  var hin=timeField(function(){return r.h||0;},function(h){
    r.h=h||0; markDirty(); refreshRemain(d.key,remainEl);
  },{label:"Time on this brand",placeholder:"0:00"});

  var nin=el("input",{type:"text",placeholder:"Note (optional)",value:r.n||"","aria-label":"Note"});
  nin.addEventListener("input",function(){ r.n=nin.value; markDirty(); });

  row.appendChild(bsel);
  row.appendChild(tsel);
  row.appendChild(el("div",{class:"hbox"},[hin,el("span",{text:"h"})]));
  row.appendChild(el("button",{class:"del","aria-label":"Remove row",text:"×",onclick:function(){
    S.doc.days[d.key].rows.splice(i,1); markDirty(); render();
  }}));
  row.appendChild(el("div",{class:"note"},[nin]));
  return row;
}

function refreshRemain(key,node){
  if(!node)return;
  var rem=dayRemainMin(key);
  node.className="remain"+(rem===0?" done":" warn");
  node.textContent=remainText(rem);
}
function setWorked(key,v){ ensureDay(key).worked=fromMin(toMin(v)); markDirty(); render(); }
function ensureDefault(d){
  if(S.closed)return;
  var dd=ensureDay(d.key);
  if(dd.worked===null||dd.worked===undefined){
    dd.worked=d.weekend?0:(S.doc.dailyDefault||8);
    markDirty();
  }
}
function copyPrevDay(d){
  var days=weekDays(S.week);
  for(var i=d.idx-1;i>=0;i--){
    var prev=S.doc.days[days[i].key];
    if(prev&&prev.rows&&prev.rows.length){
      var dd=ensureDay(d.key);
      dd.rows=prev.rows.map(function(r){return {b:r.b,t:r.t,h:r.h,n:r.n};});
      if(dd.worked===null||dd.worked===undefined)dd.worked=prev.worked;
      markDirty(); render(); return;
    }
  }
  flash("No earlier day this week has entries to copy.");
}

      el("td",{text:p.team||"—",style:p.team?"":"color:var(--muted)"}),
      el("td",{class:"num",text:t.worked?fmtHM(t.worked):"—"}),
      el("td",{class:"num",text:t.reploid?fmtHM(t.reploid):"—"}),
      el("td",{},[ el("div",{style:"text-align:right;font-variant-numeric:tabular-nums",

    ]));

    el("td",{text:S.teamFilter?(S.teamFilter==="__none"?"No team":S.teamFilter):"All teams"}),
    el("td",{text:""}),
    el("td",{class:"num",text:fmtHM(tot.worked)}),

  ]));

    el("th",{text:"Person"}),el("th",{text:"Team"}),el("th",{class:"num",text:"Worked"}),
    el("th",{class:"num",text:"REPLOID h"}),el("th",{class:"num",text:"REPLOID share"})
  ])]),tb]));

  var track=el("div",{class:"track",style:"margin-top:22px"});
  track.appendChild(el("div",{class:"fill",style:"width:"+Math.min(100,stot.ofWorked)+"%"}));
  track.appendChild(el("div",{class:"ticklbl",text:"80"}));
  track.appendChild(el("div",{class:"tick"}));

  m.appendChild(el("div",{class:"legend"},[
    el("span",{text:"REPLOID share "+(tot.worked?Math.round(stot.ofWorked)+"%":"—")+" of hours worked"}),
    el("span",{text:"Excluding overhead: "+((tot.reploid+tot.external)?Math.round(stot.ofFacing)+"%":"—")})
  ]));
  return m;

var HEADER_FILL={type:"pattern",pattern:"solid",fgColor:{argb:"FF1F1F1F"}};
var HEADER_FONT={bold:true,color:{argb:"FFFFFFFF"},name:"Arial",size:11};
var BASE_FONT={name:"Arial",size:11};
var BOLD_FONT={name:"Arial",size:11,bold:true};
var TITLE_FONT={bold:true,color:{argb:"FFD6001C"},name:"Arial",size:14};
var MUTED_FONT={italic:true,color:{argb:"FF6B6B6B"},name:"Arial",size:10};
var XCOLS=[
  {header:"Date",width:12},{header:"Employee",width:26},{header:"Employee Type",width:14},
  {header:"Brand / Project",width:22},{header:"Hours",width:9},{header:"Task",width:18},
  {header:"Notes",width:32},{header:"BMD Hours (Day)",width:16},{header:"Difference to BMD",width:16},
  {header:"Team",width:18}
];
function colLetter(n){var s="";while(n>0){var m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26);}return s;}
function styleHeaderRow(row){row.eachCell(function(c){c.fill=HEADER_FILL;c.font=HEADER_FONT;c.alignment={vertical:"middle"};});row.height=22;}
function weekRangeLabelDots(weekId){
  var d=weekDays(weekId);
  var f=function(dd){return dd.label+mondayOf(weekId).getUTCFullYear();};
  return d[0].label+mondayOf(weekId).getUTCFullYear()+" \u2013 "+d[6].label+mondayOf(weekId).getUTCFullYear();
}

function addAboutSheet(wb,label){
  var ws=wb.addWorksheet("About");
  ws.getColumn(1).width=22; ws.getColumn(2).width=90;
  var title=ws.addRow(["Brand Time",label+" hours report \u2014 Alimentastic GmbH"]);
  title.getCell(1).font=TITLE_FONT; title.getCell(2).font=BOLD_FONT;
  ws.addRow([]);
  [
    ["Purpose","Allocation of employee hours to brands, so REPLOID-facing work can be measured against its share of the retainer."],
    ["Who",label==="All teams"?"Every employee, logged individually.":"Every member of the "+label+" team, logged individually."],
    ["Granularity","One row per employee, day and brand/project."],
    ["Unassignable hours","Recorded under Team & planning, Admin & reporting, Recruiting & onboarding or Learning & development rather than a brand."],
    ["BMD reconciliation","Each employee also enters the day\u2019s total hours as logged in BMD (the \u201cBMD Hours (Day)\u201d column). The Difference column should read 0."],
    ["Evaluation sheet","Sums hours automatically per brand and per week."],
    ["Note","Hours are self-reported by each employee and are not the official working-time record \u2014 BMD remains the system of record."],
    ["Generated","Automatically by Brand Time. This workbook is a report, not a form \u2014 there are no cells to fill in."]
  ].forEach(function(pair){
    var r=ws.addRow(pair);
    r.getCell(1).font=BOLD_FONT; r.getCell(2).font=BASE_FONT;
    r.getCell(2).alignment={wrapText:true,vertical:"top"};
  });
}

function addWeekSheetXL(wb,weekId,flat,label){
  var name=("Week "+weekId.split("-W")[1]).slice(0,31);
  var ws=wb.addWorksheet(name);
  XCOLS.forEach(function(c,i){ ws.getColumn(i+1).width=c.width; });
  ws.mergeCells(1,1,1,10);
  ws.getCell(1,1).value=label+" \u2014 Week "+weekId.split("-W")[1]+" \u2014 "+weekRangeLabelDots(weekId);
  ws.getCell(1,1).font=TITLE_FONT;
  ws.mergeCells(2,1,2,10);
  ws.getCell(2,1).value="Generated automatically by Brand Time \u2014 not a form to fill in.";
  ws.getCell(2,1).font=MUTED_FONT;

  var headerRowIdx=4;
  var headerRow=ws.getRow(headerRowIdx);
  XCOLS.forEach(function(c,i){ headerRow.getCell(i+1).value=c.header; });
  styleHeaderRow(headerRow);
  ws.views=[{state:"frozen",ySplit:headerRowIdx}];

  var firstDataRow=headerRowIdx+1;
  var lastDataRow=firstDataRow+Math.max(flat.length,1)-1;

  var groupSum={};
  flat.forEach(function(f){ var key=f.employee+"||"+f.date; groupSum[key]=(groupSum[key]||0)+f.hours; });

  var brandTotals={};
  flat.forEach(function(f,i){
    var rowNum=firstDataRow+i;
    var r=ws.getRow(rowNum);
    r.getCell(1).value=new Date(f.date+"T00:00:00Z"); r.getCell(1).numFmt="dd.mm.yyyy";
    r.getCell(2).value=f.employee;
    r.getCell(3).value=f.type;
    r.getCell(4).value=f.brand;
    r.getCell(5).value=f.hours; r.getCell(5).numFmt="0.00";
    r.getCell(6).value=f.task;
    r.getCell(7).value=f.notes;
    r.getCell(8).value=f.bmd; r.getCell(8).numFmt="0.00";
    r.getCell(10).value=f.team;
    var diff=r2(groupSum[f.employee+"||"+f.date]-f.bmd);
    r.getCell(9).value={formula:"IF(OR(B"+rowNum+'="",H'+rowNum+'=""),"",SUMIFS($E$'+firstDataRow+":$E$"+lastDataRow+",$B$"+firstDataRow+":$B$"+lastDataRow+",B"+rowNum+",$A$"+firstDataRow+":$A$"+lastDataRow+",A"+rowNum+")-H"+rowNum+")",result:diff};
    r.getCell(9).numFmt="0.00";
    r.eachCell(function(c){ c.font=BASE_FONT; });
    brandTotals[f.brand]=(brandTotals[f.brand]||0)+f.hours;     // exact; rounded only when written
  });
  if(!flat.length){
    ws.getRow(firstDataRow).getCell(1).value="No entries for this week.";
    ws.getRow(firstDataRow).getCell(1).font=MUTED_FONT;
  }
  var weekTotal=flat.reduce(function(s,f){return s+f.hours;},0);     // exact; rounded only when written
  ws.getCell(3,4).value="Total hours"; ws.getCell(3,4).font=BOLD_FONT;
  ws.getCell(3,5).value=flat.length?{formula:"SUM(E"+firstDataRow+":E"+lastDataRow+")",result:r2(weekTotal)}:0;
  ws.getCell(3,5).font=BOLD_FONT; ws.getCell(3,5).numFmt="0.00";

  return {sheetName:name,firstDataRow:firstDataRow,lastDataRow:flat.length?lastDataRow:firstDataRow-1,
    brandCol:"D",hoursCol:"E",brandTotals:brandTotals,weekTotal:weekTotal};
}

function addEvaluationSheetXL(wb,weekMeta){
  var ws=wb.addWorksheet("Evaluation");
  ws.getCell(1,1).value="Evaluation \u2014 hours per brand and week"; ws.getCell(1,1).font=TITLE_FONT;
  ws.getCell(2,1).value="Summed automatically from each week sheet."; ws.getCell(2,1).font=MUTED_FONT;

  var brands=activeBrands().slice().sort(function(a,b){return a.name.localeCompare(b.name);});
  var headerRowIdx=4;
  var header=ws.getRow(headerRowIdx);
  header.getCell(1).value="Brand / Project";
  weekMeta.forEach(function(wm,i){ header.getCell(2+i).value=wm.sheetName; });
  header.getCell(2+weekMeta.length).value="Total";
  styleHeaderRow(header);
  ws.getColumn(1).width=24;
  weekMeta.forEach(function(_,i){ ws.getColumn(2+i).width=12; });
  ws.getColumn(2+weekMeta.length).width=12;

  brands.forEach(function(b,ri){
    var rowNum=headerRowIdx+1+ri;
    var r=ws.getRow(rowNum);
    r.getCell(1).value=b.name; r.getCell(1).font=BASE_FONT;
    var rowTotal=0;
    weekMeta.forEach(function(wm,ci){
      var raw=wm.brandTotals[b.name]||0, val=r2(raw); rowTotal+=raw;
      var cell=r.getCell(2+ci);
      cell.value=wm.lastDataRow>=wm.firstDataRow
        ? {formula:"SUMIFS('"+wm.sheetName+"'!$"+wm.hoursCol+"$"+wm.firstDataRow+":$"+wm.hoursCol+"$"+wm.lastDataRow+",'"+wm.sheetName+"'!$"+wm.brandCol+"$"+wm.firstDataRow+":$"+wm.brandCol+"$"+wm.lastDataRow+",$A"+rowNum+")",result:val}
        : 0;
      cell.numFmt="0.00"; cell.font=BASE_FONT;
    });
    var totalCell=r.getCell(2+weekMeta.length);
    totalCell.value={formula:"SUM("+colLetter(2)+rowNum+":"+colLetter(1+weekMeta.length)+rowNum+")",result:r2(rowTotal)};
    totalCell.numFmt="0.00"; totalCell.font=BOLD_FONT;
  });

  var totalRowIdx=headerRowIdx+1+brands.length;
  var totalRow=ws.getRow(totalRowIdx);
  totalRow.getCell(1).value="Total"; totalRow.getCell(1).font=BOLD_FONT;
  for(var c=2;c<=2+weekMeta.length;c++){
    var colL=colLetter(c), sum=0;
    if(c-2<weekMeta.length)sum=r2(weekMeta[c-2].weekTotal);
    else weekMeta.forEach(function(wm){ sum+=wm.weekTotal; });
    sum=r2(sum);
    totalRow.getCell(c).value={formula:"SUM("+colL+(headerRowIdx+1)+":"+colL+(totalRowIdx-1)+")",result:sum};
    totalRow.getCell(c).numFmt="0.00"; totalRow.getCell(c).font=BOLD_FONT;
  }
  ws.views=[{state:"frozen",ySplit:headerRowIdx}];
}

function downloadBlob(buf,filename){
  var blob=new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a"); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
}

function buildExport(fromStr,toStr,teamFilter,out){
  if(!fromStr||!toStr||fromStr>toStr){
    out.className="status err"; out.textContent="Check the dates — the end must come after the start."; return;
  }
  api("export&from="+fromStr+"&to="+toStr).then(function(j){
    var recs=(j.rows||[]).filter(function(rec){
      if(!teamFilter)return true;
      return teamFilter==="__none"?!rec.team:rec.team===teamFilter;
    });
    var label=teamFilter?(teamFilter==="__none"?"No team":teamFilter):"All teams";
    var byWeek={};
    var totalLines=0;
    recs.forEach(function(rec){
      var days=(rec.doc&&rec.doc.days)||{};
      Object.keys(days).sort().forEach(function(k){
        if(k<fromStr||k>toStr)return;
        var d=days[k]||{}, worked=+d.worked||0;
        (d.rows||[]).forEach(function(r){
          var b=brandById(r.b);
          (byWeek[rec.week]=byWeek[rec.week]||[]).push({
            date:k,employee:rec.email||"(unknown)",type:"Internal",brand:b.name,
            hours:+r.h||0,task:r.t||"",notes:r.n||"",bmd:worked,team:rec.team||"(no team)"
          });
          totalLines++;
        });
      });
    });
    var weekIds=Object.keys(byWeek).sort();
    if(!weekIds.length){ out.className="status err"; out.textContent="No entries in that range."; return; }

    var wb=new ExcelJS.Workbook();
    wb.creator="Brand Time"; wb.created=new Date();
    addAboutSheet(wb,label);
    var weekMeta=weekIds.map(function(w){ return addWeekSheetXL(wb,w,byWeek[w],label); });
    addEvaluationSheetXL(wb,weekMeta);

    wb.xlsx.writeBuffer().then(function(buf){
      downloadBlob(buf,"brand-time_"+(teamFilter?label.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")+"_":"")+fromStr+"_"+toStr+".xlsx");
      out.className="status saved"; out.textContent="File downloaded — "+totalLines+" lines across "+weekIds.length+" week(s).";
    }).catch(function(e){
      out.className="status err"; out.textContent="Export failed — "+e.message;
    });
  }).catch(function(e){
    out.className="status err"; out.textContent="Export failed — "+e.message;
  });
}

/* ===================== login screen ===================== */
function renderLogin(){
  document.getElementById("tabs").style.display="none";
  var main=document.getElementById("main"); clear(main);
  var signup=S.authMode==="signup";
  var box=el("div",{class:"login"});
  box.appendChild(el("h1",{text:signup?"Create your login":"Sign in"}));
  box.appendChild(el("p",{class:"lede",text:signup
    ? "Use your work email address and choose your team. Only addresses on the team list are accepted."
    : "Weekly brand time."}));

  var email=el("input",{type:"email",autocomplete:"username",placeholder:"you@company.com"});
  var pw=el("input",{type:"password",
    autocomplete:signup?"new-password":"current-password",placeholder:"••••••••"});
  var msg=el("div",{class:"msg"});
  var btn=el("button",{class:"btn",text:signup?"Create login":"Sign in"});
  var teamSel=null;
  if(signup){
    teamSel=el("select",{"aria-label":"Your team"});
    var fillTeams=function(list){
      clear(teamSel);
      teamSel.appendChild(el("option",{value:"",text:"Choose your team…"}));
      (list||[]).forEach(function(t){ teamSel.appendChild(el("option",{value:t,text:t})); });
    };
    fillTeams(S.teamOptions||[]);
    if(!S.teamOptions){
      auth("teams").then(function(j){ S.teamOptions=j.teams||[]; fillTeams(S.teamOptions); })
        .catch(function(){ msg.className="msg err"; msg.textContent="Could not load the team list. Please reload the page."; });
    }
  }

  function go(){
    var e=email.value.trim().toLowerCase(), p=pw.value;
    if(!e||!p){ msg.className="msg err"; msg.textContent="Email and password, please."; return; }
    if(signup&&p.length<8){ msg.className="msg err";
      msg.textContent="Use at least 8 characters."; return; }
    if(signup&&!teamSel.value){ msg.className="msg err"; msg.textContent="Please choose your team."; return; }
    btn.disabled=true; msg.className="msg"; msg.textContent="…";
    auth(signup?"signup":"login",signup?{email:e,password:p,team:teamSel.value}:{email:e,password:p}).then(function(){
      if(signup){
        msg.className="msg ok"; msg.textContent="Account created. Signing you in…";
        return auth("login",{email:e,password:p});
      }
    }).then(function(){ location.reload(); })
      .catch(function(err){
        btn.disabled=false; msg.className="msg err";
        msg.textContent=err.status===401?"That email and password don't match."
          :(err.message||"Could not sign in.");
      });
  }
  btn.addEventListener("click",go);
  pw.addEventListener("keydown",function(ev){ if(ev.key==="Enter")go(); });

  box.appendChild(el("label",{text:"Work email"})); box.appendChild(email);
  box.appendChild(el("label",{text:"Password"}));   box.appendChild(pw);
  if(signup){ box.appendChild(el("label",{text:"Team"})); box.appendChild(teamSel); }
  box.appendChild(btn);
  box.appendChild(msg);
  box.appendChild(el("button",{class:"swap",
    text:signup?"I already have a login":"First time here? Create a login",
    onclick:function(){ S.authMode=signup?"login":"signup"; renderLogin(); }}));
  main.appendChild(box);
}

  sel.appendChild(el("option",{value:"",text:"Choose your team…"}));
  (S.teams||[]).forEach(function(t){ sel.appendChild(el("option",{value:t,text:t})); });
  var msg=el("div",{class:"msg"});

/* ===================== shell ===================== */
function renderTabs(){
  var tabs=document.getElementById("tabs");
  tabs.style.display="";
  clear(tabs);
  var list=[["week","My week"]];
  if(S.admin)list.push(["team","Teams"],["reports","Reports"],["brands","Brands"],["export","Export"]);
  list.forEach(function(t){
    tabs.appendChild(el("button",{text:t[1],"aria-current":S.view===t[0]?"true":"false",
      onclick:function(){
        flushThen(function(){
          S.view=t[0];
          if(t[0]==="team"&&!S.team)loadTeam(S.teamWeek||S.week);
          else render();
        });
      }}));
  });
}
function render(){
  if(!S.ready)return;
  if(!S.authed)return renderLogin();
  if(S.needsTeam)return renderTeamPick();
  renderTabs();
  var wrapEl=document.querySelector(".wrap"); if(wrapEl)wrapEl.classList.toggle("wide",S.view==="reports");
  var main=document.getElementById("main"); clear(main);
  if(S.view==="week")main.appendChild(renderWeek());
  else if(S.view==="team")main.appendChild(renderTeam());
  else if(S.view==="reports")main.appendChild(renderReports());
  else if(S.view==="brands")main.appendChild(renderBrands());
  else if(S.view==="export")main.appendChild(renderExport());
}
function renderWho(){
  var who=document.getElementById("who"); clear(who);
  if(!S.authed)return;
  who.appendChild(document.createTextNode(((S.me&&S.me.email)||"")+(S.me&&S.me.team?" · "+S.me.team:"")+(S.admin?" · admin":"")));
  who.appendChild(el("button",{class:"out",text:"Sign out",onclick:function(){
    auth("logout",{}).catch(function(){}).then(function(){ location.reload(); });
  }}));
}

/* ===================== boot ===================== */
api("bootstrap").then(function(j){
  S.me=j.user; S.admin=!!(j.user&&j.user.admin);
  S.cfg=j.config||{brands:[],tasks:[]};
  if(!S.cfg.brands)S.cfg.brands=[];
  if(!S.cfg.tasks)S.cfg.tasks=[];
  S.teams=j.teams||[]; S.cfg.teams=S.teams.slice();
  S.needsTeam=!!j.needsTeam;
  S.doc.dailyDefault=(j.profile&&j.profile.dailyDefault)||8;
  S.authed=true; S.ready=true;
  S.week=isoWeekOf(new Date());
  renderWho();
  if(S.needsTeam){ render(); return; }
  if(!S.cfg.brands.length&&!S.admin){
    var main=document.getElementById("main"); clear(main);
    main.appendChild(el("div",{class:"empty",
      text:"No brands set up yet. The brand list has to be added before anyone can log time."}));
    return;
  }
  if(!S.cfg.brands.length&&S.admin){ S.view="brands"; render(); return; }
  return loadWeek(S.week);
}).catch(function(e){
  S.ready=true;
  if(e.status===401){ S.authed=false; renderWho(); renderLogin(); return; }
  var main=document.getElementById("main"); clear(main);
  main.appendChild(el("div",{class:"empty",text:"Could not start up — "+(e.message||"unknown error")}));
});

window.addEventListener("beforeunload",function(ev){
  if(S.dirty){ev.preventDefault();ev.returnValue="";}
});
})();
